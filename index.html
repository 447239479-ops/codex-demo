<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>提示词卡片生成器</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <!-- 页面整体布局：三栏结构 -->
    <div class="mx-auto flex min-h-screen max-w-7xl flex-col gap-6 p-6 lg:flex-row">
      <!-- 左侧表单区：输入提示词参数 -->
      <form
        id="prompt-form"
        class="flex w-full flex-col gap-4 rounded-xl bg-white p-6 shadow-lg ring-1 ring-slate-200 lg:w-1/4"
        aria-labelledby="form-title"
      >
        <header class="flex items-center justify-between">
          <h1 id="form-title" class="text-xl font-semibold text-slate-900">
            提示词设置
          </h1>
          <span class="rounded-full bg-sky-100 px-3 py-1 text-xs font-medium text-sky-700"
            >基本配置</span
          >
        </header>

        <!-- 输入：标题 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">标题</span>
          <input
            type="text"
            id="prompt-title"
            name="title"
            placeholder="例如：新品发布社交媒体文案生成"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          />
        </label>

        <!-- 输入：目标/用途 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">目标 / 用途</span>
          <input
            type="text"
            id="prompt-goal"
            name="goal"
            placeholder="请描述想要达成的目标，例如：提升活动报名率"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          />
        </label>

        <!-- 输入：目标读者/平台（下拉） -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">目标读者 / 平台</span>
          <select
            id="prompt-audience"
            name="audience"
            class="w-full appearance-none rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          >
            <option value="" disabled selected>请选择主要发布平台或受众</option>
            <option value="微信公众号读者">微信公众号读者</option>
            <option value="小红书用户">小红书用户</option>
            <option value="企业内部邮件">企业内部邮件</option>
            <option value="抖音/短视频观众">抖音/短视频观众</option>
            <option value="LinkedIn 专业人士">LinkedIn 专业人士</option>
          </select>
        </label>

        <!-- 输入：场景/任务描述 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">场景 / 任务描述</span>
          <textarea
            rows="3"
            id="prompt-task"
            name="task"
            placeholder="详细说明业务背景、目标场景和需要完成的任务"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          ></textarea>
        </label>

        <!-- 输入：角色设定 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">角色设定</span>
          <input
            type="text"
            id="prompt-role"
            name="role"
            placeholder="例如：资深营销顾问、专业翻译官"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          />
        </label>

        <!-- 多选：语气与风格 -->
        <fieldset class="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <legend class="px-2 text-sm font-medium text-slate-600">语气与风格（可多选）</legend>
          <div class="grid grid-cols-1 gap-2 text-sm text-slate-600">
            <label class="flex items-center gap-2">
              <input type="checkbox" name="tone" value="专业可信" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>专业可信</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="tone" value="亲切友好" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>亲切友好</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="tone" value="数据驱动" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>数据驱动</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="tone" value="创意活泼" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>创意活泼</span>
            </label>
          </div>
        </fieldset>

        <!-- 多选：结构与格式 -->
        <fieldset class="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <legend class="px-2 text-sm font-medium text-slate-600">结构与格式（可多选）</legend>
          <div class="grid grid-cols-1 gap-2 text-sm text-slate-600">
            <label class="flex items-center gap-2">
              <input type="checkbox" name="structure" value="分段说明" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>分段说明</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="structure" value="列出要点" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>列出要点</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="structure" value="表格输出" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>表格输出</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="structure" value="Markdown 标题" class="h-4 w-4 rounded border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>Markdown 标题</span>
            </label>
          </div>
        </fieldset>

        <!-- 单选：输出语言 -->
        <fieldset class="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <legend class="px-2 text-sm font-medium text-slate-600">输出语言</legend>
          <div class="grid grid-cols-1 gap-2 text-sm text-slate-600">
            <label class="flex items-center gap-2">
              <input type="radio" name="output-language" value="中文" class="h-4 w-4 border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>中文</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="radio" name="output-language" value="英文" class="h-4 w-4 border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>英文</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="radio" name="output-language" value="中英双语" class="h-4 w-4 border-slate-300 text-sky-500 focus:ring-sky-400" />
              <span>中英双语</span>
            </label>
          </div>
        </fieldset>

        <!-- 输入：变量设置区 -->
        <fieldset class="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
          <legend class="px-2 text-sm font-medium text-slate-600">变量设置区</legend>
          <p class="text-xs text-slate-500">
            每行一个键值对，格式为
            <code class="rounded bg-white px-1 py-0.5 text-[11px] text-slate-600">变量名=变量值</code>
            ，例如：<code class="rounded bg-white px-1 py-0.5 text-[11px] text-slate-600">主题=AI 生成器</code>
            。
          </p>
          <textarea
            rows="3"
            id="prompt-variables"
            name="variables"
            placeholder="主题=AI 生成器\n语气=亲切专业\n产品=PromptMate"
            class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          ></textarea>
          <p class="text-xs text-slate-500">
            生成的提示词中可通过 <code class="rounded bg-white px-1 py-0.5 text-[11px] text-slate-600">{{变量名}}</code>
            进行引用，未配置的变量将被自动留空。
          </p>
        </fieldset>

        <!-- 输入：约束与红线 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">约束与红线</span>
          <textarea
            rows="3"
            id="prompt-constraints"
            name="constraints"
            placeholder="列出禁止出现的内容、敏感词或必须遵守的规则"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          ></textarea>
        </label>

        <!-- 输入：批量主题输入 -->
        <label class="flex flex-col gap-2">
          <span class="text-sm font-medium text-slate-600">批量主题输入</span>
          <textarea
            rows="3"
            id="prompt-batch"
            name="batch-topics"
            placeholder="每行一个主题或关键词，支持批量生成"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-100"
          ></textarea>
        </label>

        <!-- 底部操作：预留生成按钮 -->
        <div class="mt-2 flex items-center gap-3">
          <button
            type="button"
            class="flex-1 rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200"
          >
            生成卡片
          </button>
          <button
            type="reset"
            class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:border-slate-300 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-200"
          >
            重置
          </button>
        </div>
      </form>

      <!-- 中间预览区：展示生成卡片 -->
      <main
        class="flex w-full flex-col gap-4 rounded-xl bg-white p-8 shadow-lg ring-1 ring-slate-200 lg:w-2/4"
        aria-labelledby="preview-title"
      >
        <header class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <h2 id="preview-title" class="text-xl font-semibold text-slate-900">
              卡片预览
            </h2>
            <span class="text-xs text-slate-400">实时展示生成效果</span>
          </div>
          <p class="text-sm text-slate-500">
            在这里预览生成的提示词卡片内容，包括标题、适用场景与具体指令。
          </p>
        </header>

        <!-- 主题切换：浅色 / 奶油 / 深色 -->
        <div class="flex flex-wrap items-center gap-2 rounded-2xl bg-slate-50/70 p-3">
          <p class="text-xs font-medium text-slate-500">主题样式</p>
          <button
            type="button"
            class="flex items-center gap-2 rounded-full bg-slate-900 px-4 py-1.5 text-xs font-semibold text-white shadow-sm"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-gradient-to-br from-white via-slate-200 to-slate-400"></span>
            浅色（默认）
          </button>
          <button
            type="button"
            class="flex items-center gap-2 rounded-full border border-amber-200 bg-amber-50 px-4 py-1.5 text-xs font-semibold text-amber-700"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-gradient-to-br from-amber-100 via-amber-200 to-amber-300"></span>
            奶油
          </button>
          <button
            type="button"
            class="flex items-center gap-2 rounded-full border border-slate-600 bg-slate-900 px-4 py-1.5 text-xs font-semibold text-slate-100"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-gradient-to-br from-slate-600 via-slate-700 to-black"></span>
            深色
          </button>
        </div>

        <!-- 卡片预览容器：展示 assemblePrompt 结果 -->
        <article
          class="flex h-full flex-col rounded-3xl border border-slate-200 bg-gradient-to-br from-white via-white to-slate-50 p-8 shadow-xl"
        >
          <!-- 卡片头部：标题与标签 -->
          <header class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p class="text-[11px] font-semibold uppercase tracking-[0.3em] text-slate-400">AI 提示词卡片</p>
              <h3 id="preview-card-title" class="mt-3 text-2xl font-bold text-slate-900">等待生成的提示词</h3>
            </div>
            <span
              id="preview-card-audience"
              class="rounded-full bg-sky-100 px-3 py-1 text-xs font-medium text-sky-600"
            >
              目标受众：尚未选择
            </span>
          </header>

          <!-- 卡片正文：实时显示提示词正文 -->
          <div class="mt-6 flex-1 rounded-2xl bg-white/70 p-6 text-sm leading-relaxed text-slate-700">
            <pre
              id="preview-output"
              class="h-full whitespace-pre-wrap break-words text-sm leading-relaxed text-slate-700"
            >请在左侧填写提示词信息，生成结果会实时显示在这里。</pre>
          </div>

          <!-- 卡片底部：时间戳与来源 -->
          <footer class="mt-8 flex items-center justify-between border-t border-slate-200 pt-4 text-xs text-slate-400">
            <span id="preview-timestamp">最后更新：--</span>
            <span>生成来源：提示词卡片生成器</span>
          </footer>
        </article>
      </main>

      <!-- 右侧工具栏：导出与复制操作 -->
      <aside
        class="flex w-full flex-col gap-5 rounded-xl bg-white p-6 shadow-lg ring-1 ring-slate-200 lg:w-1/4"
        aria-labelledby="toolbar-title"
      >
        <header class="flex items-center justify-between">
          <h2 id="toolbar-title" class="text-xl font-semibold text-slate-900">
            工具栏
          </h2>
          <span class="text-xs text-slate-400">导出与复制</span>
        </header>

        <!-- 操作按钮组：生成与复制 -->
        <div class="space-y-3">
          <h3 class="text-sm font-medium text-slate-600">生成与复制</h3>
          <div class="grid grid-cols-1 gap-2">
            <button
              type="button"
              class="w-full rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-200"
            >
              生成提示词
            </button>
            <button
              type="button"
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-200"
            >
              复制提示词
            </button>
            <button
              type="button"
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-200"
            >
              复制 Markdown
            </button>
          </div>
        </div>

        <!-- 操作按钮组：导出 -->
        <div class="space-y-3">
          <h3 class="text-sm font-medium text-slate-600">导出选项</h3>
          <div class="grid grid-cols-1 gap-2">
            <button
              type="button"
              class="w-full rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-200"
            >
              导出 PNG
            </button>
            <button
              type="button"
              class="w-full rounded-lg bg-indigo-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
            >
              导出 PDF
            </button>
          </div>
        </div>

        <!-- 操作按钮组：模板管理 -->
        <div class="space-y-3">
          <h3 class="text-sm font-medium text-slate-600">模板管理</h3>
          <div class="grid grid-cols-1 gap-2">
            <button
              type="button"
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-200"
            >
              保存模板
            </button>
            <button
              type="button"
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-slate-300 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-200"
            >
              加载模板
            </button>
          </div>
        </div>
      </aside>
    </div>
  </body>
  <script>
    // 缓存表单与预览相关的 DOM 元素
    const promptForm = document.getElementById('prompt-form');
    const titleInput = document.getElementById('prompt-title');
    const goalInput = document.getElementById('prompt-goal');
    const audienceSelect = document.getElementById('prompt-audience');
    const taskInput = document.getElementById('prompt-task');
    const roleInput = document.getElementById('prompt-role');
    const variablesInput = document.getElementById('prompt-variables');
    const constraintsInput = document.getElementById('prompt-constraints');

    const previewTitle = document.getElementById('preview-card-title');
    const previewAudience = document.getElementById('preview-card-audience');
    const previewOutput = document.getElementById('preview-output');
    const previewTimestamp = document.getElementById('preview-timestamp');

    // 工具函数：提取多选框的选中值
    function getCheckedValues(name) {
      return Array.from(promptForm.querySelectorAll(`input[name="${name}"]:checked`))
        .map((input) => input.value.trim())
        .filter(Boolean);
    }

    // 工具函数：整理多行文本，移除空白行
    function normalizeMultiline(value) {
      return value
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .join('\n');
    }

    // 解析变量设置区，返回键值对映射
    function parseVariablePairs(value) {
      return value
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .reduce((acc, line) => {
          const separatorIndex = line.indexOf('=');
          if (separatorIndex === -1) {
            return acc;
          }

          const key = line.slice(0, separatorIndex).trim();
          if (!key) {
            return acc;
          }

          const variableValue = line.slice(separatorIndex + 1).trim();
          acc[key] = variableValue;
          return acc;
        }, {});
    }

    // 将变量占位符替换为实际值，未配置的变量默认替换为空字符串
    function applyVariablesToText(text, variables) {
      if (!text) return text;

      return text.replace(/\{\{\s*([^{}]+?)\s*\}\}/g, (match, key) => {
        const normalizedKey = key.trim();
        if (Object.prototype.hasOwnProperty.call(variables, normalizedKey)) {
          return variables[normalizedKey];
        }
        return '';
      });
    }

    // 组装提示词正文，遵循既定顺序，自动跳过空内容，并支持变量替换
    function assemblePrompt(variables = {}) {
      const sections = [];

      const title = titleInput.value.trim();
      if (title) {
        sections.push(`# ${title}`);
      }

      const goal = goalInput.value.trim();
      if (goal) {
        sections.push(`### 目标\n${goal}`);
      }

      const role = roleInput.value.trim();
      if (role) {
        sections.push(`### 角色\n${role}`);
      }

      const audienceValue = audienceSelect.value.trim();
      if (audienceValue) {
        sections.push(`### 受众/平台\n${audienceValue}`);
      }

      const task = normalizeMultiline(taskInput.value);
      if (task) {
        sections.push(`### 任务\n${task}`);
      }

      const tones = getCheckedValues('tone');
      if (tones.length) {
        sections.push(`### 文风与语气\n${tones.map((tone) => `- ${tone}`).join('\n')}`);
      }

      const structures = getCheckedValues('structure');
      if (structures.length) {
        sections.push(`### 结构\n${structures.map((structure) => `- ${structure}`).join('\n')}`);
      }

      const constraints = normalizeMultiline(constraintsInput.value);
      if (constraints) {
        sections.push(`### 约束与红线\n${constraints}`);
      }

      const combinedText = sections.join('\n\n');
      return applyVariablesToText(combinedText, variables);
    }

    // 更新时间戳展示
    function formatTimestamp(date) {
      return date.toLocaleString('zh-CN', {
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    // 根据表单内容刷新预览卡片
    function updatePreview() {
      const variables = parseVariablePairs(variablesInput.value);
      const assembledText = assemblePrompt(variables);
      const currentTitle = titleInput.value.trim();
      const audienceOption = audienceSelect.selectedOptions[0];

      previewOutput.textContent = assembledText || '请在左侧填写提示词信息，生成结果会实时显示在这里。';
      previewTitle.textContent = applyVariablesToText(currentTitle, variables) || '等待生成的提示词';

      if (audienceOption && audienceOption.value) {
        previewAudience.textContent = `目标受众：${applyVariablesToText(
          audienceOption.textContent.trim(),
          variables,
        )}`;
      } else {
        previewAudience.textContent = '目标受众：尚未选择';
      }

      if (assembledText) {
        previewTimestamp.textContent = `最后更新：${formatTimestamp(new Date())}`;
      } else {
        previewTimestamp.textContent = '最后更新：--';
      }
    }

    // 监听表单输入变化，保持实时更新
    promptForm.addEventListener('input', updatePreview);
    promptForm.addEventListener('change', updatePreview);
    promptForm.addEventListener('reset', () => {
      // 等待浏览器完成表单重置后再刷新预览
      window.requestAnimationFrame(updatePreview);
    });

    // 初始化预览区域
    updatePreview();
  </script>
</html>
