<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本排版导出工具</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #6366f1;
        --accent-strong: #7c3aed;
        --accent-soft: rgba(99, 102, 241, 0.18);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
        background: radial-gradient(circle at top, #f7f4ef, #ebe6df);
        font-family: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei',
          system-ui, sans-serif;
        color: #1f2937;
      }

      main {
        width: min(1140px, 100%);
        display: grid;
        gap: 32px;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 48px rgba(31, 41, 55, 0.12);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        border-radius: 18px;
        border: 1px solid #d1d5db;
        padding: 16px 20px;
        font-size: 1rem;
        line-height: 1.6;
        font-family: 'LXGW WenKai Screen', 'Noto Serif SC', 'Source Han Serif SC',
          'Songti SC', 'PingFang SC', 'Microsoft YaHei', serif;
        color: #1f2937;
        background: rgba(248, 250, 252, 0.9);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .settings-grid {
        margin-top: 20px;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.95rem;
        color: #4b5563;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field-label {
        font-weight: 600;
        color: #374151;
      }

      select,
      input[type='color'],
      input[type='text'],
      input[type='range'] {
        border-radius: 14px;
        border: 1px solid #d1d5db;
        padding: 10px 14px;
        font-size: 0.95rem;
        font-family: inherit;
        color: #1f2937;
        background: rgba(255, 255, 255, 0.92);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type='color'] {
        height: 44px;
        padding: 4px;
      }

      input[type='range'] {
        padding: 0;
        height: 36px;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .range-value {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .cover-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #d1d5db;
        background: rgba(248, 250, 252, 0.8);
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .cover-toggle input {
        width: 18px;
        height: 18px;
      }

      .cover-toggle:hover,
      .cover-toggle:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .dimension {
        font-size: 0.95rem;
        color: #4b5563;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover,
      button:focus {
        transform: translateY(-1px);
        box-shadow: 0 16px 24px var(--accent-soft);
        outline: none;
      }

      .preview-wrapper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .preview-container {
        display: grid;
        gap: 24px;
        width: 100%;
        justify-items: center;
      }

      .preview-card {
        position: relative;
        padding: 20px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 32px 56px rgba(15, 23, 42, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
      }

      canvas {
        display: block;
        width: min(100%, 380px);
        height: auto;
        max-height: 520px;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.25);
      }

      .page-label {
        font-size: 0.9rem;
        color: #4b5563;
      }

      .hint {
        font-size: 0.9rem;
        color: #6b7280;
        text-align: center;
        line-height: 1.6;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 720px) {
        body {
          padding: 24px 12px;
        }

        .panel {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>文本排版输入</h1>
        <textarea id="textInput" placeholder="在此输入要排版的正文内容…"></textarea>
        <div class="settings-grid">
          <label class="field">
            <span class="field-label">主题</span>
            <select id="themeSelect">
              <option value="classic">经典米色</option>
              <option value="ink">极简墨黑</option>
              <option value="dawn">晨曦粉橙</option>
              <option value="forest">书卷青绿</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">主色</span>
            <input type="color" id="primaryColor" value="#6366f1" />
          </label>
          <label class="field">
            <span class="field-label">正文字号</span>
            <input type="range" id="fontSize" min="36" max="72" value="52" />
            <span class="range-value" id="fontSizeValue">52 px</span>
          </label>
          <label class="field full">
            <span class="field-label">水印</span>
            <input
              type="text"
              id="watermarkInput"
              placeholder="可选：输入水印，将以半透明形式铺在页面中央"
            />
          </label>
          <div class="field full">
            <label class="cover-toggle" for="coverToggle">
              <input type="checkbox" id="coverToggle" /> 启用封面页
            </label>
          </div>
          <label class="field full is-hidden" id="coverTitleField">
            <span class="field-label">封面标题</span>
            <input type="text" id="coverTitle" placeholder="输入封面标题" />
          </label>
          <label class="field full is-hidden" id="coverSubtitleField">
            <span class="field-label">封面副标题</span>
            <input type="text" id="coverSubtitle" placeholder="输入封面副标题" />
          </label>
        </div>
        <div class="controls">
          <p class="dimension">画布尺寸：1080 × 1440，3:4 比例</p>
          <button id="downloadBtn" type="button">导出全部 PNG</button>
        </div>
      </section>
      <section class="panel preview-wrapper">
        <h1>排版预览</h1>
        <div id="previewContainer" class="preview-container"></div>
        <p class="hint" id="pageHint">
          预览以 3:4 比例展示。导出的 PNG 将保持 1080 × 1440 像素，并带有适配中文的
          字体与边距。
        </p>
      </section>
    </main>

    <script>
      const THEMES = [
        {
          id: 'classic',
          name: '经典米色',
          background: '#fdfaf3',
          textColor: '#1f2933',
          pageNumberColor: 'rgba(31, 41, 51, 0.65)',
          margin: { top: 160, right: 120, bottom: 160, left: 120 },
          fontFamily:
            "'Source Han Serif SC','Songti SC','STZhongsong','PingFang SC','Microsoft YaHei',serif",
          lineHeightMultiplier: 1.38,
          paragraphSpacingMultiplier: 0.68,
          cover: {
            background: '#fbf4e6',
            titleColor: '#1f2933',
            subtitleColor: 'rgba(31, 41, 51, 0.7)'
          }
        },
        {
          id: 'ink',
          name: '极简墨黑',
          background: '#ffffff',
          textColor: '#111827',
          pageNumberColor: 'rgba(17, 24, 39, 0.6)',
          margin: { top: 150, right: 140, bottom: 150, left: 140 },
          fontFamily:
            "'Source Han Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif",
          lineHeightMultiplier: 1.45,
          paragraphSpacingMultiplier: 0.75,
          cover: {
            background: '#f4f4f5',
            titleColor: '#111827',
            subtitleColor: 'rgba(17, 24, 39, 0.65)'
          }
        },
        {
          id: 'dawn',
          name: '晨曦粉橙',
          background: '#fff6f2',
          textColor: '#512a2a',
          pageNumberColor: 'rgba(81, 42, 42, 0.65)',
          margin: { top: 170, right: 130, bottom: 170, left: 130 },
          fontFamily:
            "'Source Han Serif SC','Songti SC','STZhongsong','PingFang SC','Microsoft YaHei',serif",
          lineHeightMultiplier: 1.4,
          paragraphSpacingMultiplier: 0.7,
          cover: {
            background: '#ffe9e1',
            titleColor: '#7f1d1d',
            subtitleColor: 'rgba(127, 29, 29, 0.68)'
          }
        },
        {
          id: 'forest',
          name: '书卷青绿',
          background: '#f3faf5',
          textColor: '#16312b',
          pageNumberColor: 'rgba(22, 49, 43, 0.6)',
          margin: { top: 160, right: 110, bottom: 160, left: 110 },
          fontFamily:
            "'Source Han Serif SC','Songti SC','STKaiti','PingFang SC','Microsoft YaHei',serif",
          lineHeightMultiplier: 1.42,
          paragraphSpacingMultiplier: 0.72,
          cover: {
            background: '#e2f3ea',
            titleColor: '#0f1f1b',
            subtitleColor: 'rgba(15, 31, 27, 0.65)'
          }
        }
      ];

      const DEFAULT_TEXT = `朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。`;
      const DEFAULT_COVER_TITLE = '文本排版导出';
      const DEFAULT_COVER_SUBTITLE = 'Text Layout Exporter';

      const state = {
        theme: 'classic',
        primaryColor: '#6366f1',
        fontSize: 52,
        watermark: '',
        coverEnabled: false,
        coverTitle: DEFAULT_COVER_TITLE,
        coverSubtitle: DEFAULT_COVER_SUBTITLE
      };

      const textInput = document.getElementById('textInput');
      const themeSelect = document.getElementById('themeSelect');
      const primaryColorInput = document.getElementById('primaryColor');
      const fontSizeInput = document.getElementById('fontSize');
      const fontSizeValue = document.getElementById('fontSizeValue');
      const watermarkInput = document.getElementById('watermarkInput');
      const coverToggle = document.getElementById('coverToggle');
      const coverTitleField = document.getElementById('coverTitleField');
      const coverSubtitleField = document.getElementById('coverSubtitleField');
      const coverTitleInput = document.getElementById('coverTitle');
      const coverSubtitleInput = document.getElementById('coverSubtitle');
      const downloadBtn = document.getElementById('downloadBtn');
      const previewContainer = document.getElementById('previewContainer');
      const pageHint = document.getElementById('pageHint');

      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');

      function normalizeText(raw) {
        if (!raw || !raw.trim()) {
          return DEFAULT_TEXT;
        }
        return raw.replace(/\r\n?/g, '\n').trimEnd();
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const bigint = parseInt(clean.length === 3 ? clean.repeat(2) : clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255
        };
      }

      function mixWithWhite(hex, amount = 0.2) {
        const { r, g, b } = hexToRgb(hex);
        const mix = (channel) => Math.round(channel + (255 - channel) * amount);
        return `#${[mix(r), mix(g), mix(b)]
          .map((value) => value.toString(16).padStart(2, '0'))
          .join('')}`;
      }

      function hexToRgba(hex, alpha) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function setAccentColor(color) {
        const root = document.documentElement;
        root.style.setProperty('--accent', color);
        root.style.setProperty('--accent-strong', mixWithWhite(color, 0.1));
        root.style.setProperty('--accent-soft', hexToRgba(color, 0.18));
      }

      function getTheme() {
        return THEMES.find((theme) => theme.id === state.theme) || THEMES[0];
      }

      function buildConfig() {
        const theme = getTheme();
        const fontSize = Number(state.fontSize) || 52;
        const lineHeight = Math.round(
          fontSize * (theme.lineHeightMultiplier || 1.4)
        );
        const paragraphSpacing = Math.round(
          lineHeight * (theme.paragraphSpacingMultiplier || 0.7)
        );

        return {
          width: 1080,
          height: 1440,
          margin: theme.margin,
          background: theme.background,
          textColor: theme.textColor,
          pageNumberColor: theme.pageNumberColor,
          fontFamily: theme.fontFamily,
          fontSize,
          lineHeight,
          paragraphSpacing,
          accent: state.primaryColor,
          cover: theme.cover
        };
      }

      function applyTextSettings(ctx, config) {
        ctx.fillStyle = config.textColor;
        ctx.font = `${config.fontSize}px ${config.fontFamily}`;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
      }

      function wrapParagraph(paragraph, maxWidth, config) {
        applyTextSettings(measureCtx, config);
        const lines = [];
        let currentLine = '';

        for (const char of paragraph) {
          const tentativeLine = currentLine + char;
          const { width } = measureCtx.measureText(tentativeLine);
          if (width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = char.trim() ? char : '';
          } else {
            currentLine = tentativeLine;
          }
        }

        if (currentLine) {
          lines.push(currentLine);
        }

        return lines;
      }

      function layoutPages(text, config) {
        const normalized = normalizeText(text);
        const paragraphs = normalized.split('\n');
        const maxWidth = config.width - config.margin.left - config.margin.right;
        const usableHeight = config.height - config.margin.top - config.margin.bottom;

        const pages = [];
        let currentPage = [];
        let cursorY = 0;

        const commitPage = () => {
          if (currentPage.length) {
            pages.push(currentPage);
          }
          currentPage = [];
          cursorY = 0;
        };

        const ensureSpace = (space) => {
          if (cursorY + space > usableHeight && currentPage.length) {
            commitPage();
          }
        };

        paragraphs.forEach((paragraph, index) => {
          const isLastParagraph = index === paragraphs.length - 1;
          if (!paragraph.trim()) {
            ensureSpace(config.lineHeight);
            currentPage.push({ text: '', offsetY: cursorY });
            cursorY += config.lineHeight;
            return;
          }

          const lines = wrapParagraph(paragraph, maxWidth, config);
          lines.forEach((line) => {
            ensureSpace(config.lineHeight);
            currentPage.push({ text: line, offsetY: cursorY });
            cursorY += config.lineHeight;
          });

          if (!isLastParagraph) {
            ensureSpace(config.paragraphSpacing);
            cursorY += config.paragraphSpacing;
          }
        });

        if (currentPage.length) {
          pages.push(currentPage);
        }

        if (!pages.length) {
          pages.push([]);
        }

        return pages;
      }

      function drawBackground(ctx, config, overrideBackground) {
        const background = overrideBackground || config.background;
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, config.width, config.height);

        ctx.strokeStyle = hexToRgba(config.accent, 0.22);
        ctx.lineWidth = 2;
        ctx.strokeRect(
          config.margin.left,
          config.margin.top,
          config.width - config.margin.left - config.margin.right,
          config.height - config.margin.top - config.margin.bottom
        );
      }

      function drawWatermark(ctx, config) {
        if (!state.watermark.trim()) {
          return;
        }

        ctx.save();
        ctx.translate(config.width / 2, config.height / 2);
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = hexToRgba(config.accent, 0.08);
        ctx.font = `600 ${Math.round(config.fontSize * 1.8)}px ${config.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.watermark, 0, 0);
        ctx.restore();
      }

      function drawPageNumber(ctx, config, pageIndex, totalPages) {
        ctx.save();
        ctx.fillStyle = config.pageNumberColor || hexToRgba(config.textColor, 0.65);
        ctx.font = `400 ${Math.round(config.fontSize * 0.5)}px ${config.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(
          `第 ${pageIndex + 1} 页 / 共 ${totalPages} 页`,
          config.width / 2,
          config.height - config.margin.bottom / 2
        );
        ctx.restore();
      }

      function drawPage(canvas, lines, config, pageIndex, totalPages) {
        canvas.width = config.width;
        canvas.height = config.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, config.width, config.height);

        drawBackground(ctx, config);
        drawWatermark(ctx, config);
        applyTextSettings(ctx, config);

        lines.forEach(({ text, offsetY }) => {
          if (text) {
            ctx.fillText(
              text,
              config.margin.left,
              config.margin.top + offsetY
            );
          }
        });

        drawPageNumber(ctx, config, pageIndex, totalPages);
      }

      function drawCoverPage(canvas, config, pageIndex, totalPages) {
        canvas.width = config.width;
        canvas.height = config.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, config.width, config.height);

        const coverBackground = config.cover?.background || config.background;
        drawBackground(ctx, config, coverBackground);
        drawWatermark(ctx, config);

        const title = coverTitleInput.value.trim() || state.coverTitle;
        const subtitle = coverSubtitleInput.value.trim() || state.coverSubtitle;

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        ctx.fillStyle = config.cover?.titleColor || config.textColor;
        ctx.font = `700 ${Math.round(config.fontSize * 2.1)}px ${config.fontFamily}`;
        ctx.fillText(title, config.width / 2, config.margin.top + config.lineHeight);

        ctx.fillStyle = config.cover?.subtitleColor || hexToRgba(config.textColor, 0.7);
        ctx.font = `400 ${Math.round(config.fontSize * 1.05)}px ${config.fontFamily}`;
        ctx.fillText(
          subtitle,
          config.width / 2,
          config.margin.top + config.lineHeight * 3.2
        );

        ctx.restore();

        drawPageNumber(ctx, config, pageIndex, totalPages);
      }

      function render() {
        const config = buildConfig();
        measureCanvas.width = config.width;
        measureCanvas.height = config.height;

        const pages = layoutPages(textInput.value, config);
        const includeCover = state.coverEnabled;
        const totalPages = pages.length + (includeCover ? 1 : 0);

        previewContainer.innerHTML = '';

        const allPages = [];
        if (includeCover) {
          allPages.push({ type: 'cover' });
        }
        pages.forEach((lines) => {
          allPages.push({ type: 'content', lines });
        });

        allPages.forEach((page, index) => {
          const card = document.createElement('div');
          card.className = 'preview-card';

          const canvas = document.createElement('canvas');
          if (page.type === 'cover') {
            drawCoverPage(canvas, config, index, totalPages);
          } else {
            drawPage(canvas, page.lines, config, index, totalPages);
          }

          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = `第 ${index + 1} 页`;

          card.appendChild(canvas);
          card.appendChild(label);
          previewContainer.appendChild(card);
        });

        if (!allPages.length) {
          const card = document.createElement('div');
          card.className = 'preview-card';
          const canvas = document.createElement('canvas');
          drawPage(canvas, [], config, 0, 1);
          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = '第 1 页';
          card.appendChild(canvas);
          card.appendChild(label);
          previewContainer.appendChild(card);
        }

        const theme = getTheme();
        pageHint.textContent = `当前主题：${theme.name} · 正文字号 ${config.fontSize}px · 总页数 ${totalPages} 页。`;
      }

      function downloadAllPNGs() {
        const canvases = previewContainer.querySelectorAll('canvas');
        if (!canvases.length) {
          return;
        }

        canvases.forEach((canvas, index) => {
          canvas.toBlob((blob) => {
            if (!blob) {
              return;
            }
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `排版导出-第${String(index + 1).padStart(2, '0')}页.png`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
          }, 'image/png');
        });
      }

      function toggleCoverFields(show) {
        coverTitleField.classList.toggle('is-hidden', !show);
        coverSubtitleField.classList.toggle('is-hidden', !show);
        if (show) {
          if (!coverTitleInput.value.trim()) {
            coverTitleInput.value = state.coverTitle;
          }
          if (!coverSubtitleInput.value.trim()) {
            coverSubtitleInput.value = state.coverSubtitle;
          }
        }
      }

      textInput.addEventListener('input', render);
      themeSelect.addEventListener('change', (event) => {
        state.theme = event.target.value;
        render();
      });
      primaryColorInput.addEventListener('input', (event) => {
        state.primaryColor = event.target.value;
        setAccentColor(state.primaryColor);
        render();
      });
      fontSizeInput.addEventListener('input', (event) => {
        state.fontSize = Number(event.target.value);
        fontSizeValue.textContent = `${state.fontSize} px`;
        render();
      });
      watermarkInput.addEventListener('input', (event) => {
        state.watermark = event.target.value;
        render();
      });
      coverToggle.addEventListener('change', (event) => {
        state.coverEnabled = event.target.checked;
        toggleCoverFields(state.coverEnabled);
        render();
      });
      coverTitleInput.addEventListener('input', () => {
        state.coverTitle = coverTitleInput.value.trim() || DEFAULT_COVER_TITLE;
        render();
      });
      coverSubtitleInput.addEventListener('input', () => {
        state.coverSubtitle =
          coverSubtitleInput.value.trim() || DEFAULT_COVER_SUBTITLE;
        render();
      });
      downloadBtn.addEventListener('click', downloadAllPNGs);

      document.addEventListener('DOMContentLoaded', () => {
        textInput.value = DEFAULT_TEXT;
        fontSizeValue.textContent = `${state.fontSize} px`;
        setAccentColor(state.primaryColor);
        coverTitleInput.value = state.coverTitle;
        coverSubtitleInput.value = state.coverSubtitle;
        render();
      });
    </script>
  </body>
</html>
