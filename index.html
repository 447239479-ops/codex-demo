<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本排版导出工具</title>
    <style>
      :root {
        color-scheme: light;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
        background: radial-gradient(circle at top, #f7f4ef, #ebe6df);
        font-family: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei',
          system-ui, sans-serif;
        color: #1f2937;
      }

      main {
        width: min(1080px, 100%);
        display: grid;
        gap: 32px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 24px 48px rgba(31, 41, 55, 0.12);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        border-radius: 16px;
        border: 1px solid #d1d5db;
        padding: 16px 20px;
        font-size: 1rem;
        line-height: 1.6;
        font-family: 'LXGW WenKai Screen', 'Noto Serif SC', 'Source Han Serif SC',
          'Songti SC', 'PingFang SC', 'Microsoft YaHei', serif;
        color: #1f2937;
        background: rgba(248, 250, 252, 0.9);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .dimension {
        font-size: 0.95rem;
        color: #4b5563;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover,
      button:focus {
        transform: translateY(-1px);
        box-shadow: 0 16px 24px rgba(99, 102, 241, 0.25);
        outline: none;
      }

      .preview-wrapper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .preview-container {
        display: grid;
        gap: 24px;
        width: 100%;
        justify-items: center;
      }

      .preview-card {
        position: relative;
        padding: 20px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 32px 56px rgba(15, 23, 42, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      canvas {
        display: block;
        width: min(100%, 360px);
        height: auto;
        max-height: 480px;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.25);
      }

      .page-label {
        font-size: 0.9rem;
        color: #4b5563;
      }

      .hint {
        font-size: 0.9rem;
        color: #6b7280;
        text-align: center;
        line-height: 1.6;
      }

      @media (max-width: 720px) {
        body {
          padding: 24px 12px;
        }

        .panel {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>文本排版输入</h1>
        <textarea id="textInput" placeholder="在此输入要排版的正文内容…"></textarea>
        <div class="controls">
          <p class="dimension">画布尺寸：1080 × 1440，3:4 比例</p>
          <button id="downloadBtn" type="button">导出全部 PNG</button>
        </div>
      </section>
      <section class="panel preview-wrapper">
        <h1>排版预览</h1>
        <div id="previewContainer" class="preview-container"></div>
        <p class="hint" id="pageHint">
          预览以 3:4 比例展示。导出的 PNG 将保持 1080 × 1440 像素，并带有适配中文的
          字体与边距。
        </p>
      </section>
    </main>

    <script>
      const CONFIG = {
        width: 1080,
        height: 1440,
        margin: {
          top: 160,
          right: 120,
          bottom: 160,
          left: 120
        },
        background: '#fdfaf3',
        textColor: '#1f2933',
        fontSize: 52,
        lineHeight: 72,
        paragraphSpacing: 28,
        fontFamily:
          "'LXGW WenKai Screen','Noto Serif SC','Source Han Serif SC','Songti SC','STZhongsong','PingFang SC','Microsoft YaHei', serif"
      };

      const textInput = document.getElementById('textInput');
      const downloadBtn = document.getElementById('downloadBtn');
      const previewContainer = document.getElementById('previewContainer');
      const pageHint = document.getElementById('pageHint');

      const measureCanvas = document.createElement('canvas');
      measureCanvas.width = CONFIG.width;
      measureCanvas.height = CONFIG.height;
      const measureCtx = measureCanvas.getContext('2d');

      const DEFAULT_TEXT = `朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。`;

      function normalizeText(raw) {
        if (!raw || !raw.trim()) {
          return DEFAULT_TEXT;
        }
        return raw.replace(/\r\n?/g, '\n').trimEnd();
      }

      function applyTextSettings(ctx) {
        ctx.fillStyle = CONFIG.textColor;
        ctx.font = `${CONFIG.fontSize}px ${CONFIG.fontFamily}`;
        ctx.textBaseline = 'top';
      }

      function wrapParagraph(paragraph, maxWidth) {
        applyTextSettings(measureCtx);
        const lines = [];
        let currentLine = '';

        for (const char of paragraph) {
          const tentativeLine = currentLine + char;
          const { width } = measureCtx.measureText(tentativeLine);
          if (width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = char.trim() ? char : '';
          } else {
            currentLine = tentativeLine;
          }
        }

        if (currentLine) {
          lines.push(currentLine);
        }

        return lines;
      }

      function layoutPages(text) {
        const normalized = normalizeText(text);
        const paragraphs = normalized.split('\n');
        const maxWidth =
          CONFIG.width - CONFIG.margin.left - CONFIG.margin.right;
        const usableHeight =
          CONFIG.height - CONFIG.margin.top - CONFIG.margin.bottom;

        const pages = [];
        let currentPage = [];
        let cursorY = 0;

        const commitPage = () => {
          if (currentPage.length) {
            pages.push(currentPage);
          }
          currentPage = [];
          cursorY = 0;
        };

        const ensureSpace = (space) => {
          if (cursorY + space > usableHeight && currentPage.length) {
            commitPage();
          }
        };

        paragraphs.forEach((paragraph, index) => {
          const isLastParagraph = index === paragraphs.length - 1;
          if (!paragraph.trim()) {
            ensureSpace(CONFIG.lineHeight);
            currentPage.push({ text: '', offsetY: cursorY });
            cursorY += CONFIG.lineHeight;
            return;
          }

          const lines = wrapParagraph(paragraph, maxWidth);
          lines.forEach((line) => {
            ensureSpace(CONFIG.lineHeight);
            currentPage.push({ text: line, offsetY: cursorY });
            cursorY += CONFIG.lineHeight;
          });

          if (!isLastParagraph) {
            ensureSpace(CONFIG.paragraphSpacing);
            cursorY += CONFIG.paragraphSpacing;
          }
        });

        if (currentPage.length) {
          pages.push(currentPage);
        }

        if (!pages.length) {
          pages.push([]);
        }

        return pages;
      }

      function drawBackground(ctx) {
        ctx.fillStyle = CONFIG.background;
        ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

        ctx.strokeStyle = 'rgba(99, 102, 241, 0.16)';
        ctx.lineWidth = 2;
        ctx.strokeRect(
          CONFIG.margin.left,
          CONFIG.margin.top,
          CONFIG.width - CONFIG.margin.left - CONFIG.margin.right,
          CONFIG.height - CONFIG.margin.top - CONFIG.margin.bottom
        );
      }

      function drawPage(canvas, lines) {
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
        drawBackground(ctx);
        applyTextSettings(ctx);

        lines.forEach(({ text, offsetY }) => {
          if (text) {
            ctx.fillText(text, CONFIG.margin.left, CONFIG.margin.top + offsetY);
          }
        });
      }

      function render() {
        const pages = layoutPages(textInput.value);
        previewContainer.innerHTML = '';

        pages.forEach((lines, index) => {
          const card = document.createElement('div');
          card.className = 'preview-card';

          const canvas = document.createElement('canvas');
          drawPage(canvas, lines);

          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = `第 ${index + 1} 页`;

          card.appendChild(canvas);
          card.appendChild(label);
          previewContainer.appendChild(card);
        });

        pageHint.textContent = `当前共 ${pages.length} 页，可导出全部 PNG（导出尺寸 1080 × 1440）。`;
      }

      function downloadAllPNGs() {
        const canvases = previewContainer.querySelectorAll('canvas');
        if (!canvases.length) {
          return;
        }

        canvases.forEach((canvas, index) => {
          canvas.toBlob((blob) => {
            if (!blob) {
              return;
            }
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `排版导出-第${String(index + 1).padStart(2, '0')}页.png`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
          }, 'image/png');
        });
      }

      textInput.addEventListener('input', render);
      downloadBtn.addEventListener('click', downloadAllPNGs);

      document.addEventListener('DOMContentLoaded', () => {
        textInput.value = DEFAULT_TEXT;
        render();
      });
    </script>
  </body>
</html>
