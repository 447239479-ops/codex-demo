<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文取名神器</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --primary: #3460ff;
        --primary-dark: #2543b9;
        --accent: #2dd4bf;
        --text-main: #1f2937;
        --text-light: #6b7280;
        --panel: #ffffff;
        --border: #e5e7eb;
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        --radius-lg: 20px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --font: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font);
        color: var(--text-main);
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 35%, #f4f6fb 100%);
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        width: 100%;
        padding: 32px 16px 0;
      }

      .hero {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        align-items: center;
      }

      .hero-content h1 {
        font-size: clamp(2rem, 4vw, 2.6rem);
        margin: 0 0 12px;
        letter-spacing: 0.03em;
      }

      .hero-content p {
        margin: 0;
        color: var(--text-light);
        line-height: 1.6;
      }

      main {
        flex: 1;
        width: 100%;
        padding: 24px 16px 48px;
      }

      .app-shell {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .card {
        background: var(--panel);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: clamp(16px, 2vw, 24px);
      }

      .config-form {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        font-weight: 600;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .field small {
        color: var(--text-light);
        font-weight: 400;
      }

      input[type='text'],
      input[type='number'],
      select {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        font-size: 14px;
        transition: border 0.2s ease, box-shadow 0.2s ease;
        background-color: #fff;
      }

      input[type='text']:focus,
      input[type='number']:focus,
      select:focus {
        outline: none;
        border-color: rgba(52, 96, 255, 0.65);
        box-shadow: 0 0 0 3px rgba(52, 96, 255, 0.15);
      }

      .chip-group,
      .radio-group,
      .checkbox-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-main);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .chip.selected {
        background: rgba(52, 96, 255, 0.08);
        color: var(--primary-dark);
        border-color: rgba(52, 96, 255, 0.4);
        box-shadow: inset 0 0 0 1px rgba(52, 96, 255, 0.25);
      }

      .radio-chip {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        background: #fff;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .radio-chip input {
        display: none;
      }

      .radio-chip.active {
        background: rgba(45, 212, 191, 0.16);
        border-color: rgba(45, 212, 191, 0.4);
        color: #0f766e;
      }

      .action-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
        border-top: 1px solid var(--border);
        padding-top: 16px;
        margin-top: 8px;
      }

      .btn {
        border: none;
        border-radius: var(--radius-sm);
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        box-shadow: 0 12px 24px rgba(52, 96, 255, 0.25);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-secondary {
        background: rgba(52, 96, 255, 0.08);
        color: var(--primary-dark);
      }

      .btn-outline {
        border: 1px solid rgba(52, 96, 255, 0.3);
        background: transparent;
        color: var(--primary-dark);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .results-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .results-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .results-header .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        background: #f9fafb;
      }

      .results-header input[type='search'] {
        border: none;
        background: transparent;
        flex: 1;
        font-size: 14px;
      }

      .results-header input[type='search']:focus {
        outline: none;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }

      thead {
        background: #f3f4f6;
      }

      th,
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--text-light);
        text-transform: uppercase;
      }

      tbody tr:hover {
        background: rgba(52, 96, 255, 0.05);
      }

      .name-button {
        background: none;
        border: none;
        color: var(--primary-dark);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }

      .score-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(45, 212, 191, 0.18);
        color: #0f766e;
        border-radius: 999px;
        padding: 4px 10px;
        font-weight: 600;
        font-size: 13px;
      }

      details.score-details {
        margin-top: 6px;
      }

      details.score-details summary {
        cursor: pointer;
        color: var(--primary-dark);
        font-size: 13px;
      }

      details.score-details ul {
        margin: 6px 0 0;
        padding-left: 16px;
        color: var(--text-light);
        font-size: 13px;
        line-height: 1.6;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
        gap: 12px;
      }

      .pagination button {
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .pagination button:disabled {
        background: #f3f4f6;
        cursor: not-allowed;
      }

      .empty-state {
        padding: 32px;
        text-align: center;
        border: 2px dashed rgba(52, 96, 255, 0.15);
        border-radius: var(--radius-lg);
        background: rgba(248, 250, 252, 0.65);
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }

      .empty-state p {
        margin: 0;
        color: var(--text-light);
      }

      .toast {
        position: fixed;
        inset-inline-end: 24px;
        inset-block-end: 24px;
        background: rgba(31, 41, 55, 0.92);
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.2);
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        font-size: 14px;
        z-index: 1000;
      }

      .toast.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      @media (max-width: 900px) {
        .config-form {
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        table {
          min-width: 680px;
        }
      }

      @media (max-width: 600px) {
        header {
          padding-top: 24px;
        }

        .hero {
          gap: 16px;
        }

        .config-form {
          grid-template-columns: 1fr;
        }

        .action-bar {
          justify-content: flex-start;
        }

        .results-header {
          flex-direction: column;
          align-items: stretch;
        }

        .results-header .search-box {
          width: 100%;
        }
      }

      @media (max-width: 375px) {
        main {
          padding: 16px 12px 32px;
        }
        .card {
          padding: 16px;
        }
        table {
          min-width: 600px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hero">
        <div class="hero-content">
          <h1>中文取名神器</h1>
          <p>
            根据姓名学要素与个人偏好，快速生成带拼音、释义、笔画、五行与综合评分的候选姓名。
            支持离线使用、一键复制与导出 CSV。
          </p>
        </div>
      </div>
    </header>
    <main>
      <div class="app-shell">
        <section class="card">
          <form id="configForm" class="config-form">
            <div class="field">
              <label for="surname">姓氏 <small>必填</small></label>
              <input
                id="surname"
                name="surname"
                type="text"
                placeholder="请输入姓氏，例如：李"
                required
                minlength="1"
                maxlength="2"
              />
            </div>
            <div class="field">
              <label>性别倾向</label>
              <div class="radio-group" id="genderGroup">
                <label class="radio-chip active">
                  <input type="radio" name="gender" value="中性" checked />
                  中性
                </label>
                <label class="radio-chip">
                  <input type="radio" name="gender" value="男" />
                  男孩
                </label>
                <label class="radio-chip">
                  <input type="radio" name="gender" value="女" />
                  女孩
                </label>
              </div>
            </div>
            <div class="field">
              <label>风格偏好</label>
              <div class="chip-group" id="styleChips"></div>
            </div>
            <div class="field">
              <label>名字符号</label>
              <div class="radio-group" id="namePattern">
                <label class="radio-chip active">
                  <input type="radio" name="pattern" value="double" checked />
                  双名
                </label>
                <label class="radio-chip">
                  <input type="radio" name="pattern" value="single" />
                  单名
                </label>
              </div>
            </div>
            <div class="field">
              <label>五行偏好</label>
              <div class="chip-group" id="wuxingChips"></div>
            </div>
            <div class="field">
              <label>笔画范围</label>
              <div class="checkbox-row">
                <input
                  type="number"
                  id="strokeMin"
                  name="strokeMin"
                  min="1"
                  max="30"
                  placeholder="最少"
                />
                <input
                  type="number"
                  id="strokeMax"
                  name="strokeMax"
                  min="1"
                  max="30"
                  placeholder="最多"
                />
              </div>
            </div>
            <div class="field">
              <label for="tonePreference">声调偏好</label>
              <select id="tonePreference" name="tonePreference">
                <option value="不限">不限</option>
                <option value="平">全平</option>
                <option value="仄">全仄</option>
                <option value="平仄">平仄</option>
                <option value="仄平">仄平</option>
              </select>
            </div>
            <div class="field">
              <label for="avoidChars">避讳字 <small>多个以逗号分隔</small></label>
              <input
                id="avoidChars"
                name="avoidChars"
                type="text"
                placeholder="如：强,刚"
                maxlength="20"
              />
            </div>
            <div class="field">
              <label for="generateCount">生成数量</label>
              <input
                id="generateCount"
                name="generateCount"
                type="number"
                min="10"
                max="200"
                value="50"
              />
            </div>
            <div class="field">
              <label for="strokeFlex">字形偏好</label>
              <select id="strokeFlex" name="strokeFlex">
                <option value="balanced" selected>均衡</option>
                <option value="slim">简洁</option>
                <option value="complex">厚重</option>
              </select>
            </div>
            <div class="field full-width" style="grid-column: 1 / -1">
              <div class="action-bar">
                <button type="button" class="btn btn-secondary" id="clearBtn">清空条件</button>
                <button type="submit" class="btn btn-primary" id="generateBtn">一键生成</button>
                <button type="button" class="btn btn-outline" id="copySelected">复制所选</button>
                <button type="button" class="btn btn-outline" id="exportCsv">导出 CSV</button>
              </div>
            </div>
          </form>
        </section>

        <section class="card results-section">
          <div class="results-header">
            <div>
              <h2 style="margin: 0 0 4px; font-size: 20px">候选名单</h2>
              <p style="margin: 0; color: var(--text-light); font-size: 13px">
                支持分页、模糊搜索、单条复制与多选批量复制。
              </p>
            </div>
            <div class="search-box">
              <span style="color: var(--text-light); font-size: 14px">🔍</span>
              <input id="resultSearch" type="search" placeholder="按姓名或拼音搜索" />
            </div>
          </div>
          <div id="resultContainer" class="table-wrapper"></div>
          <div id="pagination" class="pagination" hidden>
            <button type="button" id="prevPage">上一页</button>
            <div id="pageInfo" style="font-size: 13px; color: var(--text-light)"></div>
            <button type="button" id="nextPage">下一页</button>
          </div>
          <div id="emptyState" class="empty-state" hidden>
            <h3 style="margin: 0">条件过严，没有找到候选</h3>
            <p>建议放宽笔画、风格或五行偏好后再试一次。</p>
            <button type="button" class="btn btn-secondary" id="loosenBtn">一键放宽条件</button>
          </div>
        </section>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  "崔": "cui",
  "吉": "ji",
  "钮": "niu",
  "龚": "gong"
};
      const WUXING_OPTIONS = ['木', '火', '土', '金', '水'];
      const STYLE_OPTIONS = Object.keys(STYLE_TAGS);
      const PAGE_SIZE = 20;

      const state = {
        results: [],
        filtered: [],
        selected: new Set(),
        page: 1
      };

      const form = document.getElementById('configForm');
      const styleChips = document.getElementById('styleChips');
      const wuxingChips = document.getElementById('wuxingChips');
      const searchInput = document.getElementById('resultSearch');
      const resultContainer = document.getElementById('resultContainer');
      const pagination = document.getElementById('pagination');
      const prevPageBtn = document.getElementById('prevPage');
      const nextPageBtn = document.getElementById('nextPage');
      const pageInfo = document.getElementById('pageInfo');
      const emptyState = document.getElementById('emptyState');
      const loosenBtn = document.getElementById('loosenBtn');
      const toastEl = document.getElementById('toast');
      const copySelectedBtn = document.getElementById('copySelected');
      const exportBtn = document.getElementById('exportCsv');
      const clearBtn = document.getElementById('clearBtn');
      const selectedStyles = new Set();
      const selectedWuxing = new Set();

      function createChip(container, label, set) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.textContent = label;
        btn.addEventListener('click', () => {
          if (set.has(label)) {
            set.delete(label);
            btn.classList.remove('selected');
          } else {
            set.add(label);
            btn.classList.add('selected');
          }
        });
        container.appendChild(btn);
      }

      STYLE_OPTIONS.forEach(style => createChip(styleChips, style, selectedStyles));
      WUXING_OPTIONS.forEach(w => createChip(wuxingChips, w, selectedWuxing));

      function bindRadioGroup(groupId) {
        const group = document.getElementById(groupId);
        group.querySelectorAll('.radio-chip').forEach(label => {
          label.addEventListener('click', () => {
            group.querySelectorAll('.radio-chip').forEach(node => node.classList.remove('active'));
            label.classList.add('active');
            const input = label.querySelector('input');
            if (input) {
              input.checked = true;
            }
          });
        });
      }

      bindRadioGroup('genderGroup');
      bindRadioGroup('namePattern');

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getToneType(pinyin) {
        if (!pinyin) return '平';
        const last = pinyin[pinyin.length - 1];
        return 'aeiouv'.includes(last) ? '平' : '仄';
      }

      function lookupCharInfo(char) {
        return NAME_CHARACTERS.find(item => item.char === char);
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2000);
      }

      function copyText(text) {
        if (!text) {
          showToast('没有可复制的内容');
          return;
        }
        navigator.clipboard?.writeText(text).then(() => {
          showToast('已复制到剪贴板');
        }).catch(() => {
          const temp = document.createElement('textarea');
          temp.value = text;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          showToast('已复制到剪贴板');
        });
      }

      function gatherConfig() {
        const formData = new FormData(form);
        let surname = (formData.get('surname') || '').trim();
        if (surname.length > 2) surname = surname.slice(0, 2);
        const gender = formData.get('gender') || '中性';
        const pattern = formData.get('pattern') || 'double';
        const tonePreference = formData.get('tonePreference') || '不限';
        const strokeFlex = formData.get('strokeFlex') || 'balanced';
        const strokeMinRaw = formData.get('strokeMin');
        const strokeMaxRaw = formData.get('strokeMax');
        const strokeMin = strokeMinRaw ? Number(strokeMinRaw) : null;
        const strokeMax = strokeMaxRaw ? Number(strokeMaxRaw) : null;
        const count = clamp(Number(formData.get('generateCount')) || 50, 10, 200);
        let avoidChars = (formData.get('avoidChars') || '')
          .split(/[,，\s]+/)
          .map(ch => ch.trim())
          .filter(Boolean);
        avoidChars = Array.from(new Set(avoidChars));
        if (strokeMin && strokeMax && strokeMin > strokeMax) {
          return { error: '笔画最小值不能大于最大值' };
        }
        return {
          surname,
          gender,
          pattern,
          tonePreference,
          strokeFlex,
          strokeMin,
          strokeMax,
          count,
          avoidSet: new Set(avoidChars),
          styles: Array.from(selectedStyles),
          wuxing: Array.from(selectedWuxing)
        };
      }

      function filterCharacters(config) {
        return NAME_CHARACTERS.filter(item => {
          if (config.avoidSet.has(item.char)) return false;
          if (config.strokeMin && item.strokes < config.strokeMin) return false;
          if (config.strokeMax && item.strokes > config.strokeMax) return false;
          return true;
        });
      }

      function computeScore(chars, config) {
        const nameLength = chars.length;
        const genderScores = chars.map(c => {
          if (c.genders.includes(config.gender)) return 1;
          if (c.genders.includes('中性')) return 0.8;
          return 0.5;
        });
        const genderScore = genderScores.reduce((sum, v) => sum + v, 0) / nameLength;

        let wuxingPrefScore = 0.75;
        if (config.wuxing.length) {
          const matches = chars.filter(c => config.wuxing.includes(c.wuxing)).length;
          wuxingPrefScore = matches / nameLength;
        }

        let strokePrefScore = 0.7;
        if (config.strokeMin !== null || config.strokeMax !== null) {
          const min = config.strokeMin ?? Math.min(...chars.map(c => c.strokes));
          const max = config.strokeMax ?? Math.max(...chars.map(c => c.strokes));
          const mid = (min + max) / 2;
          const diffAvg = chars.reduce((sum, c) => sum + Math.abs(c.strokes - mid), 0) / nameLength;
          const span = Math.max(1, (max - min) || 6);
          strokePrefScore = clamp(1 - diffAvg / (span * 1.2), 0.4, 1);
        }

        const preferenceScore = clamp((genderScore + wuxingPrefScore + strokePrefScore) / 3, 0, 1);

        let styleScore = 0.6;
        if (config.styles.length) {
          const ratios = config.styles.map(style => {
            const list = STYLE_TAGS[style] || [];
            const matches = chars.filter(c => list.includes(c.char)).length;
            return matches / nameLength;
          });
          styleScore = Math.max(...ratios);
        }

        const distinctWuxing = new Set(chars.map(c => c.wuxing)).size;
        const diversity = nameLength === 1 ? 0.7 : distinctWuxing === nameLength ? 1 : 0.75;
        const preferenceCoverage = config.wuxing.length
          ? chars.filter(c => config.wuxing.includes(c.wuxing)).length / nameLength
          : 0.7;
        const wuxingBalance = clamp(0.6 * diversity + 0.4 * preferenceCoverage, 0, 1);

        const tones = chars.map(c => getToneType(c.pinyin));
        const initials = chars.map(c => c.pinyin[0]);
        let toneScore = 0.75;
        if (config.tonePreference === '平' || config.tonePreference === '仄') {
          const desired = config.tonePreference;
          toneScore = tones.filter(t => t === desired).length / nameLength;
        } else if (config.tonePreference === '平仄' && nameLength >= 2) {
          toneScore = tones[0] === '平' && tones[1] === '仄' ? 1 : 0.5;
        } else if (config.tonePreference === '仄平' && nameLength >= 2) {
          toneScore = tones[0] === '仄' && tones[1] === '平' ? 1 : 0.5;
        }
        if (new Set(initials).size < initials.length) toneScore -= 0.1;
        const identicalPinyin = nameLength > 1 && chars.every(c => c.pinyin === chars[0].pinyin);
        if (identicalPinyin) toneScore -= 0.15;
        toneScore = clamp(toneScore, 0.2, 1);

        const strokes = chars.map(c => c.strokes);
        const maxStroke = Math.max(...strokes);
        const minStroke = Math.min(...strokes);
        const avgStroke = strokes.reduce((sum, n) => sum + n, 0) / strokes.length;
        let strokeAesthetics = 0.7;
        if (config.strokeFlex === 'balanced') {
          const diff = maxStroke - minStroke;
          strokeAesthetics = diff <= 3 ? 1 : diff <= 6 ? 0.8 : 0.5;
        } else if (config.strokeFlex === 'slim') {
          strokeAesthetics = avgStroke <= 9 ? 1 : avgStroke <= 12 ? 0.7 : 0.45;
        } else {
          strokeAesthetics = avgStroke >= 11 ? 1 : avgStroke >= 9 ? 0.75 : 0.5;
        }

        const totalScore = preferenceScore * 40 + styleScore * 20 + wuxingBalance * 20 + toneScore * 10 + strokeAesthetics * 10;
        const breakdown = {
          preference: {
            label: '偏好匹配',
            value: preferenceScore * 40,
            comment: `性别与笔画偏好${preferenceScore >= 0.8 ? '高度契合' : preferenceScore >= 0.6 ? '较为贴合' : '有待加强'}`
          },
          style: {
            label: '风格意向',
            value: styleScore * 20,
            comment: config.styles.length
              ? `与所选风格匹配度${styleScore >= 0.8 ? '极高' : styleScore >= 0.5 ? '良好' : '一般'}`
              : '未指定风格，采用通用搭配'
          },
          wuxing: {
            label: '五行均衡',
            value: wuxingBalance * 20,
            comment: `五行组合${distinctWuxing > 1 ? '更均衡' : '相对集中'}`
          },
          phonetic: {
            label: '声调顺口',
            value: toneScore * 10,
            comment: `声调组合${toneScore >= 0.8 ? '流畅悦耳' : toneScore >= 0.6 ? '自然顺口' : '略显生硬'}`
          },
          strokes: {
            label: '笔画观感',
            value: strokeAesthetics * 10,
            comment: config.strokeFlex === 'slim'
              ? `整体笔画${avgStroke <= 9 ? '轻盈爽朗' : '较为厚重'}`
              : config.strokeFlex === 'complex'
              ? `整体笔画${avgStroke >= 11 ? '沉稳大气' : '略显简约'}`
              : `笔画差异${maxStroke - minStroke <= 3 ? '协调自然' : '层次分明'}`
          }
        };

        return {
          score: Number(totalScore.toFixed(1)),
          breakdown
        };
      }

      function buildCandidateEntries(charList, config) {
        if (!charList.length) return [];
        const combinations = [];
        const pool = [...charList].sort(() => Math.random() - 0.5);
        if (config.pattern === 'single') {
          pool.forEach(char => combinations.push([char]));
        } else {
          for (let i = 0; i < pool.length; i++) {
            for (let j = 0; j < pool.length; j++) {
              combinations.push([pool[i], pool[j]]);
            }
          }
        }
        const seen = new Set();
        const candidates = [];
        let idCounter = 1;
        for (const chars of combinations) {
          const given = chars.map(c => c.char).join('');
          if (seen.has(given)) continue;
          seen.add(given);
          const { score, breakdown } = computeScore(chars, config);
          const meanings = chars.map(c => `${c.char}：${c.meaning}`).join('；');
          const strokes = chars.map(c => c.strokes);
          const totalStrokes = strokes.reduce((sum, n) => sum + n, 0);
          const strokesDetail = strokes.length > 1 ? `${strokes.join(' + ')} = ${totalStrokes}` : `${totalStrokes}`;
          const wuxingDetail = chars.map(c => c.wuxing).join('/');
          const surnameChars = config.surname.split('');
          const surnamePinyin = surnameChars.map(ch => SURNAME_PINYIN_MAP[ch] || lookupCharInfo(ch)?.pinyin || '?');
          const fullPinyin = [...surnamePinyin, ...chars.map(c => c.pinyin)].join(' ');
          const tones = chars.map(c => getToneType(c.pinyin)).join('');
          candidates.push({
            id: `name-${idCounter++}`,
            surname: config.surname,
            given,
            name: `${config.surname}${given}`,
            chars,
            meanings,
            strokesDetail,
            totalStrokes,
            wuxingDetail,
            fullPinyin,
            tonePattern: tones,
            score,
            breakdown
          });
        }
        candidates.sort((a, b) => b.score - a.score);
        return candidates;
      }

      function renderResults() {
        const list = state.filtered;
        if (!list.length) {
          resultContainer.innerHTML = '';
          pagination.hidden = true;
          emptyState.hidden = false;
          return;
        }
        emptyState.hidden = true;
        const totalPages = Math.ceil(list.length / PAGE_SIZE);
        state.page = clamp(state.page, 1, totalPages);
        const start = (state.page - 1) * PAGE_SIZE;
        const pageItems = list.slice(start, start + PAGE_SIZE);
        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>选择</th>
              <th>姓名</th>
              <th>拼音</th>
              <th>释义</th>
              <th>笔画组合</th>
              <th>五行组合</th>
              <th>评分</th>
              <th>复制</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');
        pageItems.forEach(item => {
          const tr = document.createElement('tr');
          const checked = state.selected.has(item.id) ? 'checked' : '';
          tr.innerHTML = `
            <td><input type="checkbox" data-id="${item.id}" ${checked} /></td>
            <td><button class="name-button" data-copy="${item.name}">${item.name}</button></td>
            <td>${item.fullPinyin}</td>
            <td>${item.meanings}</td>
            <td>${item.strokesDetail}</td>
            <td>${item.wuxingDetail}</td>
            <td>
              <span class="score-tag">${item.score}</span>
              <details class="score-details">
                <summary>评分详情</summary>
                <ul>
                  ${Object.values(item.breakdown).map(d => `<li>${d.label}：${d.value.toFixed(1)}分 - ${d.comment}</li>`).join('')}
                </ul>
              </details>
            </td>
            <td><button class="btn btn-outline" data-copy="${item.name}" data-full="${item.name} ${item.fullPinyin}">复制</button></td>
          `;
          tbody.appendChild(tr);
        });
        resultContainer.innerHTML = '';
        resultContainer.appendChild(table);
        pagination.hidden = totalPages <= 1;
        prevPageBtn.disabled = state.page === 1;
        nextPageBtn.disabled = state.page === totalPages;
        pageInfo.textContent = `第 ${state.page}/${totalPages} 页 · 共 ${list.length} 条`;
      }

      function applySearch(term) {
        const normalized = term.trim().toLowerCase();
        if (!normalized) {
          state.filtered = [...state.results];
        } else {
          state.filtered = state.results.filter(item =>
            item.name.includes(normalized) ||
            item.fullPinyin.replace(/\s+/g, '').includes(normalized)
          );
        }
        state.page = 1;
        renderResults();
      }

      function handleGenerate(event) {
        event.preventDefault();
        const config = gatherConfig();
        if (config.error) {
          showToast(config.error);
          return;
        }
        if (!config.surname) {
          showToast('请先填写姓氏');
          return;
        }
        const available = filterCharacters(config);
        const candidates = buildCandidateEntries(available, config);
        state.results = candidates.slice(0, config.count);
        state.filtered = [...state.results];
        state.page = 1;
        state.selected.clear();
        if (!state.results.length) {
          renderResults();
          return;
        }
        renderResults();
      }

      form.addEventListener('submit', handleGenerate);

      let searchTimer = null;
      searchInput.addEventListener('input', event => {
        clearTimeout(searchTimer);
        const value = event.target.value;
        searchTimer = setTimeout(() => applySearch(value), 200);
      });

      prevPageBtn.addEventListener('click', () => {
        state.page -= 1;
        renderResults();
      });
      nextPageBtn.addEventListener('click', () => {
        state.page += 1;
        renderResults();
      });

      loosenBtn.addEventListener('click', () => {
        selectedStyles.clear();
        selectedWuxing.clear();
        styleChips.querySelectorAll('.chip').forEach(chip => chip.classList.remove('selected'));
        wuxingChips.querySelectorAll('.chip').forEach(chip => chip.classList.remove('selected'));
        form.strokeMin.value = '';
        form.strokeMax.value = '';
        form.tonePreference.value = '不限';
        form.strokeFlex.value = 'balanced';
        form.dispatchEvent(new Event('submit'));
      });

      clearBtn.addEventListener('click', () => {
        form.reset();
        selectedStyles.clear();
        selectedWuxing.clear();
        styleChips.querySelectorAll('.chip').forEach(chip => chip.classList.remove('selected'));
        wuxingChips.querySelectorAll('.chip').forEach(chip => chip.classList.remove('selected'));
        state.results = [];
        state.filtered = [];
        state.selected.clear();
        resultContainer.innerHTML = '';
        pagination.hidden = true;
        emptyState.hidden = true;
      });

      resultContainer.addEventListener('click', event => {
        const target = event.target;
        if (target.matches('input[type="checkbox"][data-id]')) {
          const id = target.getAttribute('data-id');
          if (target.checked) {
            state.selected.add(id);
          } else {
            state.selected.delete(id);
          }
          return;
        }
        if (target.dataset.copy) {
          const full = target.dataset.full || target.dataset.copy;
          copyText(full);
        }
      });

      copySelectedBtn.addEventListener('click', () => {
        if (!state.selected.size) {
          showToast('请先勾选要复制的姓名');
          return;
        }
        const lines = state.results
          .filter(item => state.selected.has(item.id))
          .map(item => `${item.name}	${item.fullPinyin}`);
        copyText(lines.join('
'));
      });

      exportBtn.addEventListener('click', () => {
        if (!state.results.length) {
          showToast('暂无可导出的内容');
          return;
        }
        const header = 'name,pinyin,meaning,strokes_total,strokes_detail,wuxing_detail,score';
        const rows = state.results.map(item => {
          const columns = [
            item.name,
            item.fullPinyin,
            item.meanings,
            item.totalStrokes,
            item.strokesDetail,
            item.wuxingDetail,
            item.score
          ].map(value => `"${String(value).replace(/"/g, '""')}"`);
          return columns.join(',');
        });
        const blob = new Blob([header + '
' + rows.join('
')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'name_suggestions.csv';
        link.click();
        URL.revokeObjectURL(url);
        showToast('CSV 导出完成');
      });

      document.addEventListener('DOMContentLoaded', () => {
        const surnameInput = document.getElementById('surname');
        surnameInput.focus();
      });
    </script>
  </body>
</html>
