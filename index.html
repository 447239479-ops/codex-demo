        rebuildKeywordLibrary();
        showStatus(`已切换到 ${date} 的草稿`, "info");
      }

      function ensureKeywordIndexForCurrentDate({ skipLibrary = false } = {}) {
        const { date, entries } = state.currentDoc;
        if (!date) return;
        if (entries.length) {
          const index = KeywordUtils.buildIndex(entries);
          StorageService.writeKeywordIndex(date, index);
          state.keywordIndexCache.set(date, index);
        } else {
          StorageService.removeKeywordIndex(date);
          state.keywordIndexCache.delete(date);
        }
        if (!skipLibrary) {
          rebuildKeywordLibrary();
        }
      }

      function preloadKeywordIndexes(currentDate) {
        const dates = StorageService.listDocDates();
        dates.forEach((date) => {
          if (date === currentDate) return;
          loadKeywordIndex(date);
        });
      }

      function loadKeywordIndex(date) {
        const cached = StorageService.readKeywordIndex(date);
        if (cached) {
          state.keywordIndexCache.set(date, cached);
          return;
        }
        const stored = StorageService.readDoc(date);
        const entries = stored ? stored.entries : [];
        if (!entries.length) {
          StorageService.removeKeywordIndex(date);
          state.keywordIndexCache.delete(date);
          return;
        }
        const index = KeywordUtils.buildIndex(entries);
        StorageService.writeKeywordIndex(date, index);
        state.keywordIndexCache.set(date, index);
      }

      function rebuildKeywordLibrary() {
        state.keywordLibrary = KeywordUtils.mergeCache(state.keywordIndexCache);
        updateKeywordSuggestions();
      }

      function updateKeywordCachesForCurrentDate() {
        ensureKeywordIndexForCurrentDate();
      }

      function startAutosave() {
        if (state.autosaveTimer) clearInterval(state.autosaveTimer);
        state.autosaveTimer = setInterval(() => {
          if (state.isDirty) {
            saveDoc({ auto: true });
          }
        }, AUTOSAVE_INTERVAL);
      }

      function saveDoc({ auto = false } = {}) {
        if (!state.currentDoc.date) return;
        StorageService.writeDoc(state.currentDoc.date, state.currentDoc.entries);
        persistColloquialForCurrentDate();
        populateHistoryOptions();
        ensureKeywordIndexForCurrentDate();
        state.isDirty = false;
        updateFormStatus(auto ? "已自动保存草稿" : "草稿已保存");
        showStatus(auto ? "已自动保存草稿" : "已保存到本地草稿", auto ? "info" : "success");
      }

      function handleClear() {
        if (!state.currentDoc.entries.length) {
          showStatus("当前没有内容可以清空", "warning");
          return;
        }
        if (!confirm("确定清空当天所有记录吗？")) return;
        state.currentDoc.entries = [];
        StorageService.removeDoc(state.currentDoc.date);
        clearColloquialForDate(state.currentDoc.date);
        state.colloquialTexts = new Map();
        state.previewOptions.useColloquial = false;
        state.previewOptions.enableBlur = false;
        state.lastPreviewWarnings = [];
        state.lastProcessedEntries = [];
        state.isDirty = false;
        resetForm();
        refreshUI();
        ensureKeywordIndexForCurrentDate();
        populateHistoryOptions();
        updateFormStatus("当天内容已清空");
        showStatus("已清空当天草稿", "success");
      }

      // ==== 周报合并 ====
      function openWeeklyDialog() {
        logW("openWeeklyDialog invoked");
        hardBindWeeklyButtons();
        if (!state.weekly.selectedDates.size && state.currentDoc.date) {
          state.weekly.selectedDates.add(state.currentDoc.date);
        }
        if (!state.weekly.preview) {
          state.weekly.useColloquial =
            state.previewOptions.useColloquial && state.colloquialTexts.size > 0;
          state.weekly.enableBlur = state.previewOptions.enableBlur;
        }
        refreshWeeklyDateList();
        updateWeeklySelectionState();
        weeklyToggleColloquial.checked = state.weekly.useColloquial;
        weeklyToggleBlur.checked = state.weekly.enableBlur;
        if (weeklyOverlay) {
          weeklyOverlay.hidden = false;
          weeklyOverlay.classList.add("is-open");
          weeklyOverlay.style.removeProperty("display");
        }
        if (weeklyModalElement) {
          weeklyModalElement.classList.add("is-open");
          weeklyModalElement.style.removeProperty("display");
        }
        if (!state.weekly.preview) {
          resetWeeklyPreview();
        }
      }

      function closeWeeklyDialog() {
        closeWeeklyModal();
      }

      function getWeeklyCandidateDates() {
        const dates = new Set(StorageService.listDocDates());
        if (state.currentDoc.date) {
          dates.add(state.currentDoc.date);
        }
        return Array.from(dates).sort((a, b) => b.localeCompare(a));
      }

      function refreshWeeklyDateList() {
        if (!weeklyDateList) return;
        const candidates = getWeeklyCandidateDates();
        weeklyDateList.innerHTML = "";
        const candidateSet = new Set(candidates);
        let pruned = false;
        Array.from(state.weekly.selectedDates).forEach((date) => {
          if (!candidateSet.has(date)) {
            state.weekly.selectedDates.delete(date);
            pruned = true;
          }
        });
        if (pruned) {
          state.weekly.preview = null;
          resetWeeklyPreview();
        }
        if (!candidates.length) {
          const placeholder = document.createElement("div");
          placeholder.className = "empty-tip";
          placeholder.textContent = "暂无历史草稿，请先保存每日内容。";
          weeklyDateList.appendChild(placeholder);
          updateWeeklySelectionState();
          return;
        }
        candidates.forEach((date) => {
          const label = document.createElement("label");
          label.className = "weekly-date-item";
          label.dataset.date = date;
          if (state.weekly.selectedDates.has(date)) {
            label.classList.add("active");
          }
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = date;
          checkbox.dataset.date = date;
          checkbox.checked = state.weekly.selectedDates.has(date);
          const info = document.createElement("span");
          info.textContent = getWeeklyDateInfo(date);
          const title = document.createElement("strong");
          const labelText = DateUtils.toTitle(date);
          title.textContent =
            date === state.currentDoc.date ? `${labelText}（当前）` : labelText;
          label.appendChild(checkbox);
          label.appendChild(title);
          label.appendChild(info);
          weeklyDateList.appendChild(label);
        });
        updateWeeklySelectionState();
      }

      function getWeeklyDateInfo(date) {
        const isCurrent = date === state.currentDoc.date;
        const doc = isCurrent ? state.currentDoc : StorageService.readDoc(date);
        const entries = doc && Array.isArray(doc.entries) ? doc.entries : [];
        const total = entries.length;
        if (!total) return "暂无记录";
        const publishable = entries.filter((entry) => entry.publishable).length;
        if (!publishable) {
          return `${total} 条记录（无可发）`;
        }
        return `${publishable}/${total} 条可发`;
      }

      function updateWeeklySelectionState() {
        if (!weeklySelectedCount) return;
        const count = state.weekly.selectedDates.size;
        weeklySelectedCount.textContent = `已选 ${count} 天`;
        if (weeklyGenerateBtn) {
          weeklyGenerateBtn.disabled = count === 0;
          weeklyGenerateBtn.title = count === 0 ? "请先选择至少 1 天" : "";
        }
        if (weeklyClearSelectionBtn) {
          weeklyClearSelectionBtn.disabled = count === 0;
        }
        if (weeklyDateList) {
          Array.from(weeklyDateList.children).forEach((node) => {
            if (!(node instanceof HTMLElement)) return;
            const date = node.dataset.date;
            if (!date) return;
            node.classList.toggle("active", state.weekly.selectedDates.has(date));
            const checkbox = node.querySelector('input[type="checkbox"]');
            if (checkbox) {
              checkbox.checked = state.weekly.selectedDates.has(date);
            }
          });
        }
      }

      function handleWeeklyDateChange(event) {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        const date = target.value;
        if (!date) return;
        if (target.checked) {
          state.weekly.selectedDates.add(date);
        } else {
          state.weekly.selectedDates.delete(date);
        }
        state.weekly.preview = null;
        resetWeeklyPreview();
        updateWeeklySelectionState();
      }

      function clearWeeklySelection() {
        state.weekly.selectedDates.clear();
        state.weekly.preview = null;
        refreshWeeklyDateList();
        resetWeeklyPreview();
      }

      function resetWeeklyPreview() {
        if (weeklyPreviewSurface) {
          weeklyPreviewSurface.innerHTML =
            '<div class="preview-placeholder">请选择日期并生成周报预览。</div>';
        }
        if (weeklyPreviewSection) {
          weeklyPreviewSection.hidden = true;
        }
        if (weeklyWarningBanner) {
          weeklyWarningBanner.hidden = true;
          weeklyWarningBanner.textContent = "";
        }
      }

      /**
       * 生成周报预览与导出结果。
       * @param {{silent?: boolean}} [options]
       */
      function generateWeeklyReportPreview({ silent = false } = {}) {
        const selected = Array.from(state.weekly.selectedDates);
        return ensureWeeklyPreviewGenerated(selected, { silent });
      }

      /**
       * 汇总选中日期的可发记录。
       * @param {string[]} dates
       * @param {{useColloquial: boolean, enableBlur: boolean}} options
       * @returns {{entries: Entry[], warnings: {date:string,id:string,flags:string[],category:string,time:string}[]}}
       */
      function collectWeeklyEntries(dates, { useColloquial, enableBlur }) {
        const entries = [];
        const warnings = [];
        dates.forEach((date) => {
          const isCurrent = date === state.currentDoc.date;
          const doc = isCurrent ? state.currentDoc : StorageService.readDoc(date);
          const docEntries = doc && Array.isArray(doc.entries) ? doc.entries : [];
          const colloquialMap = isCurrent
            ? state.colloquialTexts
            : StorageService.readColloquial(date);
          docEntries
            .filter((entry) => entry.publishable)
            .forEach((entry) => {
              const baseContent =
                useColloquial && colloquialMap && colloquialMap.has(entry.id)
                  ? colloquialMap.get(entry.id) || ""
                  : entry.content || "";
              const detection = SafetyService.detect(baseContent);
              const finalContent = enableBlur
                ? SafetyService.applyFuzzing(baseContent)
                : baseContent;
              const processed = {
                ...entry,
                keywords: Array.isArray(entry.keywords)
                  ? [...entry.keywords]
                  : [],
                content: finalContent,
                originalContent: entry.content,
                baseContent,
                detectionFlags: detection.flags,
                date,
              };
              entries.push(processed);
              if (detection.flags && detection.flags.length) {
                warnings.push({
                  date,
                  id: entry.id,
                  flags: detection.flags,
                  category: entry.category,
                  time: entry.time,
                });
              }
            });
        });
        return { entries, warnings };
      }

      function getSelectedDatesFromWeeklyModal() {
        const modal = qs("#weeklyModal");
        if (!modal) return [];
        return qsa('input[type="checkbox"][data-date]:checked', modal)
          .map((el) => el.getAttribute("data-date"))
          .filter(Boolean);
      }

      function buildWeeklyDoc(dates) {
        const sortedDates = [...dates].sort((a, b) => a.localeCompare(b));
        const { entries, warnings } = collectWeeklyEntries(sortedDates, {
          useColloquial: state.weekly.useColloquial,
          enableBlur: state.weekly.enableBlur,
        });
        const context = WeeklyRenderer.buildContext(entries, sortedDates);
        const htmlPreview = WeeklyRenderer.buildHTML(context, { forPreview: true });
        const htmlExport = WeeklyRenderer.buildHTML(context, { forPreview: false });
        const markdown = WeeklyRenderer.buildMarkdown(context);
        return {
          title: context.title,
          start: context.period.start,
          end: context.period.end,
          md: markdown,
          html: htmlExport,
          previewHtml: htmlPreview,
          warnings,
          entries,
          context,
        };
      }

      function downloadAs(text, filename, mime) {
        downloadFile(text, filename, mime);
      }

      async function copyText(text) {
        if (!text) {
          toast("暂无可复制的内容", "warning");
          return;
        }
        const ok = await copyTextRobust(text);
        if (ok) {
          toast("已复制到剪贴板", "success");
        } else {
          toast("复制失败，请手动复制", "danger");
        }
      }

      function applyWeeklyDocToState(doc, dates, { silent = false } = {}) {
        if (!doc) return;
        const sortedDates = [...dates].sort((a, b) => a.localeCompare(b));
        state.weekly.preview = {
          context: doc.context,
          htmlPreview: doc.previewHtml,
          htmlExport: doc.html,
          markdown: doc.md,
          warnings: doc.warnings || [],
          entries: doc.entries || [],
          meta: {
            key: sortedDates.join("|"),
            useColloquial: state.weekly.useColloquial,
            enableBlur: state.weekly.enableBlur,
          },
        };
        if (weeklyToggleColloquial) {
          weeklyToggleColloquial.checked = state.weekly.useColloquial;
        }
        if (weeklyToggleBlur) {
          weeklyToggleBlur.checked = state.weekly.enableBlur;
        }
        if (weeklyPreviewSurface) {
          weeklyPreviewSurface.innerHTML = doc.previewHtml;
        }
        if (weeklyPreviewSection) {
          weeklyPreviewSection.hidden = false;
        }
        updateWeeklyWarningBanner(doc.warnings || []);
        if (!silent) {
          toast("已生成周报预览", "success");
        }
      }

      function ensureWeeklyPreviewGenerated(dates, { silent = false } = {}) {
        const sortedDates = [...dates].sort((a, b) => a.localeCompare(b));
        if (!sortedDates.length) {
          if (!silent) {
            toast("请先选择至少 1 天", "warning");
          }
          return null;
        }
        const key = sortedDates.join("|");
        const preview = state.weekly.preview;
        if (
          preview &&
          preview.meta &&
          preview.meta.key === key &&
          preview.meta.useColloquial === state.weekly.useColloquial &&
          preview.meta.enableBlur === state.weekly.enableBlur
        ) {
          return {
            title: preview.context?.title || "我的学习周报",
            start:
              preview.context?.period?.start ||
              (sortedDates.length ? sortedDates[0] : ""),
            end:
              preview.context?.period?.end ||
              (sortedDates.length ? sortedDates[sortedDates.length - 1] : ""),
            md: preview.markdown,
            html: preview.htmlExport,
            previewHtml: preview.htmlPreview,
            warnings: preview.warnings || [],
            entries: preview.entries || [],
            context: preview.context,
          };
        }
        const doc = buildWeeklyDoc(sortedDates);
        if (!doc.entries || !doc.entries.length) {
          state.weekly.preview = null;
          if (weeklyPreviewSurface) {
            weeklyPreviewSurface.innerHTML =
              '<div class="preview-placeholder">所选日期暂无可发记录。</div>';
          }
          if (weeklyPreviewSection) {
            weeklyPreviewSection.hidden = false;
          }
          updateWeeklyWarningBanner(doc.warnings || []);
          if (!silent) {
            toast("所选日期暂无可发内容", "warning");
          }
          return null;
        }
        applyWeeklyDocToState(doc, sortedDates, { silent });
        return doc;
      }

      document.body.addEventListener("click", async (event) => {
        const btn = event.target.closest("[data-action]");
        if (!btn) return;
        const act = btn.dataset.action || "";
        if (!act.startsWith("weekly-")) return;
        event.preventDefault();
        event.stopPropagation();
        logW("action:", act);
        const dates = getSelectedDatesFromWeeklyModal();
        logW("selected dates:", dates);
        const needsSelection = [
          "weekly-gen",
          "weekly-export-md",
          "weekly-export-html",
          "weekly-copy-md",
          "weekly-copy-html",
        ];
        if (needsSelection.includes(act) && !dates.length) {
          logW("no dates selected for", act);
          toast("请先选择至少 1 天", "warning");
          return;
        }
        switch (act) {
          case "weekly-gen": {
            logW("weekly-gen clicked");
            ensureWeeklyPreviewGenerated(dates, { silent: false });
            break;
          }
          case "weekly-export-md":
          case "weekly-export-html": {
            logW("weekly export triggered", act);
            const doc = ensureWeeklyPreviewGenerated(dates, { silent: true });
            if (!doc) {
              logW("export aborted: no doc");
              toast("所选日期暂无可发内容", "warning");
              return;
            }
            if (!confirmWeeklyExport(doc.warnings)) return;
            const sorted = [...dates].sort((a, b) => a.localeCompare(b));
            const start = doc.start || (sorted[0] || "");
            const end = doc.end || (sorted[sorted.length - 1] || start);
            const fileBase =
              sorted.length <= 1 || start === end
                ? start
                : `${start}_${end}`;
            if (act === "weekly-export-md") {
              downloadAs(
                doc.md,
                `学习周报_${fileBase || DateUtils.toISODate(new Date())}.md`,
                "text/markdown;charset=utf-8"
              );
            } else {
              downloadAs(
                doc.html,
                `学习周报_${fileBase || DateUtils.toISODate(new Date())}.html`,
                "text/html;charset=utf-8"
              );
            }
            break;
          }
          case "weekly-copy-md":
          case "weekly-copy-html": {
            logW("weekly copy triggered", act);
            const doc = ensureWeeklyPreviewGenerated(dates, { silent: true });
            if (!doc) {
              logW("copy aborted: no doc");
              toast("所选日期暂无可发内容", "warning");
              return;
            }
            if (!confirmWeeklyExport(doc.warnings)) return;
            const payload = act === "weekly-copy-md" ? doc.md : doc.html;
            const ok = await copyTextRobust(payload);
            logW(`${act} result:`, ok);
            if (ok) {
              toast("已复制到剪贴板", "success");
            } else {
              toast("复制失败，请手动复制", "danger");
            }
            if (act === "weekly-copy-md") {
              alert(ok ? "已复制 Markdown 到剪贴板" : "复制失败，请手动复制");
            } else {
              alert(ok ? "已复制 HTML 到剪贴板" : "复制失败，请手动复制");
            }
            break;
          }
          case "weekly-clear": {
            logW("weekly-clear clicked");
            clearWeeklySelection();
            toast("已清空选择", "info");
            break;
          }
          case "weekly-close": {
            logW("weekly-close clicked");
            closeWeeklyModal();
            break;
          }
          default:
            break;
        }
      });


      function handleWeeklyToggleColloquial() {
        state.weekly.useColloquial = weeklyToggleColloquial.checked;
        if (state.weekly.preview) {
          generateWeeklyReportPreview({ silent: true });
        }
      }

      function handleWeeklyToggleBlur() {
        state.weekly.enableBlur = weeklyToggleBlur.checked;
        if (state.weekly.preview) {
          generateWeeklyReportPreview({ silent: true });
        }
      }

      function confirmWeeklyExport(warnings) {
        if (!warnings || !warnings.length) return true;
        const detail = warnings
          .map(
            (item) =>
              `${item.date} ${item.time} ${item.category}（${item.flags.join("、")}）`
          )
          .join("\n");
        const message = `检测到 ${warnings.length} 条可能敏感信息：\n${detail}\n继续导出吗？`;
        return confirm(message);
      }

      function updateWeeklyWarningBanner(warnings) {
        if (!weeklyWarningBanner) return;
        if (warnings && warnings.length) {
          weeklyWarningBanner.hidden = false;
          weeklyWarningBanner.textContent = `⚠️ 检测到 ${warnings.length} 条可能敏感信息，请人工复核后再导出。`;
        } else {
          weeklyWarningBanner.hidden = true;
          weeklyWarningBanner.textContent = "";
        }
      }

      function handleBeforeUnload(event) {
        if (!state.isDirty) return;
        event.preventDefault();
        event.returnValue = "";
      }

      function markDirty() {
        state.isDirty = true;
        updateFormStatus("有未保存的修改，将在 10 秒内自动保存");
      }

      function updateFormStatus(text) {
        formStatus.textContent = text;
      }

      /**
       * 处理表单提交并创建或更新记录。
       * @param {SubmitEvent} event
       */
      function handleSubmit(event) {
        event.preventDefault();
        const keywords = KeywordUtils.parse(keywordsInput.value);
        const entry = {
          id:
            state.editingId || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          time: timeInput.value || "00:00",
          category: categoryInput.value,
          keywords,
          content: contentInput.value.trim(),
          importance: Number(importanceInput.value),
          publishable: publishableInput.checked,
        };
        if (!entry.content) {
          showStatus("内容不能为空", "danger");
          return;
        }
        state.colloquialTexts.delete(entry.id);
        if (state.editingId) {
          const idx = state.currentDoc.entries.findIndex((item) => item.id === state.editingId);
          if (idx !== -1) {
            state.currentDoc.entries[idx] = entry;
            showStatus("已更新记录", "success");
          }
        } else {
          state.currentDoc.entries.push(entry);
          showStatus("已添加记录", "success");
        }
        resetForm();
        refreshUI();
        updateKeywordCachesForCurrentDate();
        markDirty();
      }

      function handleTableActions(event) {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (target.classList.contains("tag")) {
          const raw = target.dataset.tag
            ? decodeURIComponent(target.dataset.tag)
            : target.textContent || "";
          const keyword = raw.trim().toLowerCase();
          if (state.activeTagFilter === keyword) {
            state.activeTagFilter = "";
            filterKeyword.value = "";
          } else {
            state.activeTagFilter = keyword;
            filterKeyword.value = keyword;
          }
          updateEntryTable();
          return;
        }
        const action = target.getAttribute("data-action");
        if (action === "edit") {
          startEdit(target.getAttribute("data-id"));
        } else if (action === "delete") {
          deleteEntry(target.getAttribute("data-id"));
        } else if (action === "colloquial") {
          applyColloquialToEntry(target.getAttribute("data-id"));
        }
      }

      function startEdit(id) {
        if (!id) return;
        const entry = state.currentDoc.entries.find((item) => item.id === id);
        if (!entry) return;
        state.editingId = id;
        timeInput.value = entry.time;
        categoryInput.value = entry.category;
        importanceInput.value = String(entry.importance);
        keywordsInput.value = entry.keywords.join(", ");
        contentInput.value = entry.content;
        publishableInput.checked = entry.publishable;
        submitBtn.textContent = "💾 保存修改";
        cancelEditBtn.hidden = false;
      }

      function deleteEntry(id) {
        if (!id) return;
        const idx = state.currentDoc.entries.findIndex((item) => item.id === id);
        if (idx === -1) return;
        if (!confirm("确定删除该条记录吗？")) return;
        state.currentDoc.entries.splice(idx, 1);
        state.colloquialTexts.delete(id);
        refreshUI();
        updateKeywordCachesForCurrentDate();
        markDirty();
        showStatus("已删除记录", "success");
        if (state.editingId === id) {
          resetForm();
        }
      }

      function resetForm() {
        form.reset();
        setCurrentTime();
        categoryInput.value = "AI";
        importanceInput.value = "5";
        publishableInput.checked = true;
        state.editingId = null;
        submitBtn.textContent = "➕ 添加记录";
        cancelEditBtn.hidden = true;
        hideKeywordSuggestions();
      }

      function refreshUI() {
        updateEntryTable();
        updatePreview();
      }

      function updateEntryTable() {
        const keywordFilter = state.activeTagFilter || filterKeyword.value.trim().toLowerCase();
        const filtered = state.currentDoc.entries.filter((entry) => {
          if (filterCategory.value && entry.category !== filterCategory.value) {
            return false;
          }
          if (filterPublishable.checked && !entry.publishable) {
            return false;
          }
          if (keywordFilter) {
            return entry.keywords.some((kw) => kw.includes(keywordFilter));
          }
          return true;
        });
        const sorted = sortEntries(filtered, sortOrder.value);
        entriesBody.innerHTML = "";
        if (!sorted.length) {
          const emptyRow = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 7;
          cell.style.textAlign = "center";
          cell.style.color = "var(--muted)";
          cell.textContent = "暂无符合条件的记录";
          emptyRow.appendChild(cell);
          entriesBody.appendChild(emptyRow);
          return;
        }
        sorted.forEach((entry) => {
          const row = document.createElement("tr");
          const tags = entry.keywords
            .map((kw) => {
              const encoded = encodeURIComponent(kw);
              const active = state.activeTagFilter && state.activeTagFilter === kw;
              return `<span class="tag${active ? " active-tag" : ""}" data-tag="${encoded}">${escapeHtml(kw)}</span>`;
            })
            .join(" ");
          const summary = entry.content.length > 42 ? `${entry.content.slice(0, 42)}…` : entry.content;
          const hasColloquial = state.colloquialTexts.has(entry.id);
          const appliedClass = hasColloquial ? ' class="applied"' : "";
          row.innerHTML = `
            <td>${entry.time}</td>
            <td><span class="pill">${escapeHtml(entry.category)}</span></td>
            <td>${tags || "-"}</td>
            <td class="importance">${"★".repeat(entry.importance)}</td>
            <td>${entry.publishable ? "✅" : "🚫"}</td>
            <td>${escapeHtml(summary)}</td>
            <td>
              <div class="actions">
                <button
                  data-action="colloquial"
                  data-id="${entry.id}"
                  aria-label="${hasColloquial ? "查看人话化内容" : "对该记录进行人话化"}"
                  ${appliedClass.trim()}
                >${hasColloquial ? "已人话化" : "人话化"}</button>
                <button
                  data-action="edit"
                  data-id="${entry.id}"
                  aria-label="编辑这条记录"
                >编辑</button>
                <button
                  data-action="delete"
                  data-id="${entry.id}"
                  aria-label="删除这条记录"
                >删除</button>
              </div>
            </td>
          `;
          entriesBody.appendChild(row);
        });
      }

      function sortEntries(entries, order) {
        const clone = [...entries];
        clone.sort((a, b) => {
          if (order === "time-asc") {
            return a.time.localeCompare(b.time);
          }
          if (order === "time-desc") {
            return b.time.localeCompare(a.time);
          }
          if (order === "importance-asc") {
            return a.importance - b.importance || a.time.localeCompare(b.time);
          }
          return b.importance - a.importance || a.time.localeCompare(b.time);
        });
        return clone;
      }

      /**
       * 按当前设置生成用于预览/导出的记录。
       * @returns {Entry[]}
       */
      function getProcessedPublishableEntries() {
        const publishable = getPublishableEntries();
        if (!publishable.length) {
          state.lastPreviewWarnings = [];
          state.lastProcessedEntries = [];
          return [];
        }
        const processed = publishable.map((entry) => {
          const baseContent =
            state.previewOptions.useColloquial && state.colloquialTexts.has(entry.id)
              ? state.colloquialTexts.get(entry.id) || ""
              : entry.content || "";
          const detection = SafetyService.detect(baseContent);
          const finalContent = state.previewOptions.enableBlur
            ? SafetyService.applyFuzzing(baseContent)
            : baseContent;
          return {
            ...entry,
            content: finalContent,
            originalContent: entry.content,
            baseContent,
            detectionFlags: detection.flags,
          };
        });
        state.lastPreviewWarnings = processed
          .filter((entry) => entry.detectionFlags && entry.detectionFlags.length)
          .map((entry) => ({
            id: entry.id,
            flags: entry.detectionFlags,
            category: entry.category,
            time: entry.time,
          }));
        state.lastProcessedEntries = processed;
        return processed;
      }

      function updatePreviewControls() {
        const hasColloquial = state.colloquialTexts.size > 0;
        if (!hasColloquial && state.previewOptions.useColloquial) {
          state.previewOptions.useColloquial = false;
        }
        if (toggleColloquial) {
          toggleColloquial.checked = hasColloquial && state.previewOptions.useColloquial;
          toggleColloquial.disabled = !hasColloquial;
          if (colloquialToggleWrapper) {
            colloquialToggleWrapper.classList.toggle("disabled", toggleColloquial.disabled);
            colloquialToggleWrapper.title = hasColloquial
              ? `已准备 ${state.colloquialTexts.size} 条人话化内容，可切换预览`
              : "暂无人话化内容";
          }
        }
        if (toggleBlur) {
          toggleBlur.checked = state.previewOptions.enableBlur;
        }
        if (batchColloquialBtn) {
          const canBatch = getPublishableEntries().length > 0;
          batchColloquialBtn.disabled = !canBatch;
          batchColloquialBtn.title = canBatch
            ? "对所有可发记录一键人话化"
            : "暂无可发记录可处理";
        }
      }

      function applyColloquialToEntry(id) {
        if (!id) return;
        const entry = state.currentDoc.entries.find((item) => item.id === id);
        if (!entry) return;
        const transformed = SafetyService.transform(entry.content || "").trim();
        if (!transformed) {
          showStatus("内容偏空，无法人话化", "warning");
          return;
        }
        state.colloquialTexts.set(id, transformed);
        state.previewOptions.useColloquial = true;
        markDirty();
        showStatus("已生成口语化版本", "success");
        updateEntryTable();
        updatePreview();
      }

      function applyColloquialToPublishable() {
        const publishable = getPublishableEntries();
        if (!publishable.length) {
          showStatus("暂无可发记录可处理", "warning");
          return;
        }
        let count = 0;
        publishable.forEach((entry) => {
          const transformed = SafetyService.transform(entry.content || "").trim();
          if (transformed) {
            state.colloquialTexts.set(entry.id, transformed);
            count += 1;
          }
        });
        if (!count) {
          showStatus("原内容过短，未能人话化", "warning");
          return;
        }
        state.previewOptions.useColloquial = true;
        markDirty();
        showStatus(`已人话化 ${count} 条可发记录`, "success");
        updateEntryTable();
        updatePreview();
      }

      function handleColloquialToggle() {
        if (toggleColloquial.disabled) return;
        state.previewOptions.useColloquial = toggleColloquial.checked && state.colloquialTexts.size > 0;
        updatePreview();
      }

      function handleBlurToggle() {
        state.previewOptions.enableBlur = toggleBlur.checked;
        updatePreview();
      }

      function handleBatchColloquial() {
        applyColloquialToPublishable();
      }

      function confirmExportIfSensitive() {
        if (!state.lastPreviewWarnings.length) return true;
        const detail = state.lastPreviewWarnings
          .map((item) => `${item.time} ${item.category}（${item.flags.join("、")}）`)
          .join("\n");
        const message = `检测到 ${state.lastPreviewWarnings.length} 条可能敏感信息：\n${detail}\n继续导出吗？`;
        return confirm(message);
      }

      /**
       * 根据当前状态刷新右侧预览。
       */
      function updatePreview() {
        const processed = getProcessedPublishableEntries();
        updatePreviewControls();
        if (!processed.length) {
          previewSurface.innerHTML =
            '<div class="preview-placeholder">暂无可对外发布内容，先去左侧添加吧。</div>';
          return;
        }
        previewSurface.innerHTML = DailyRenderer.buildHTML(true, processed);
      }

      function hasPublishableEntries() {
        return state.currentDoc.entries.some((entry) => entry.publishable);
      }

      /**
       * 复制不同格式的导出内容。
       * @param {"markdown"|"html"|"preview"} type
       */
      function handleCopy(type) {
        if (!hasPublishableEntries()) {
          showStatus("暂无可对外发布的记录", "warning");
          return;
        }
        const processed = getProcessedPublishableEntries();
        if (!processed.length) {
          showStatus("暂无可对外发布的记录", "warning");
          return;
        }
        if (!confirmExportIfSensitive()) return;
        if (type === "markdown") {
          copyToClipboard(DailyRenderer.buildMarkdown(processed));
        } else if (type === "html") {
          copyToClipboard(DailyRenderer.buildHTML(false, processed));
        } else {
          copyToClipboard(previewSurface.innerText.trim());
        }
      }

      /**
       * 下载 Markdown 或 HTML 文件。
       * @param {"markdown"|"html"} type
       */
      function handleDownload(type) {
        if (!hasPublishableEntries()) {
          showStatus("暂无可对外发布的记录", "warning");
          return;
        }
        const processed = getProcessedPublishableEntries();
        if (!processed.length) {
          showStatus("暂无可对外发布的记录", "warning");
          return;
        }
        if (!confirmExportIfSensitive()) return;
        const date = state.currentDoc.date || DateUtils.toISODate(new Date());
        if (type === "markdown") {
          downloadFile(
            DailyRenderer.buildMarkdown(processed),
            `${date}.md`,
            "text/markdown;charset=utf-8"
          );
        } else {
          downloadFile(
            DailyRenderer.buildHTML(false, processed),
            `${date}.html`,
            "text/html;charset=utf-8"
          );
        }
      }

      function getPublishableEntries() {
        return state.currentDoc.entries.filter((entry) => entry.publishable);
      }

      const TemplateHelpers = {
        sortEntries(entries) {
          return [...entries].sort((a, b) => {
            const categoryDiff =
              CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category);
            if (categoryDiff !== 0) return categoryDiff;
            if (b.importance !== a.importance) {
              return b.importance - a.importance;
            }
            return a.time.localeCompare(b.time);
          });
        },
        formatTagLine(keywords) {
          if (!keywords.length) return "-";
          return keywords.map((kw) => `#${kw}`).join(" ");
        },
        parseBlocks(content) {
          return parseContentBlocks(formatContentForMarkdown(content));
        },
        toBulletBlocks(content) {
          const blocks = TemplateHelpers.parseBlocks(content);
          const result = [];
          let currentList = [];
          blocks.forEach((block) => {
            if (block.type === "code") {
              if (currentList.length) {
                result.push({ type: "list", items: currentList });
                currentList = [];
              }
              result.push(block);
            } else {
              const segments = block.text
                .split(/[。！？!?.]/)
                .map((item) => item.trim())
                .filter(Boolean);
              if (!segments.length) return;
              currentList.push(...segments);
            }
          });
          if (currentList.length) {
            result.push({ type: "list", items: currentList });
          }
          return result.length ? result : blocks;
        },
        groupByCategory(entries, { titleBuilder } = {}) {
          const grouped = [];
          const sorted = TemplateHelpers.sortEntries(entries);
          CATEGORIES.forEach((category) => {
            const list = sorted.filter((entry) => entry.category === category);
            if (list.length) {
              grouped.push({
                title: titleBuilder ? titleBuilder(category) : category,
                entries: list,
              });
            }
          });
          return grouped;
        },
        groupByImportance(entries) {
          const sorted = TemplateHelpers.sortEntries(entries);
          const buckets = [
            { title: "高阶洞察卡", filter: (entry) => entry.importance >= 4 },
            { title: "实践方法卡", filter: (entry) => entry.importance === 3 },
            { title: "灵感速记卡", filter: (entry) => entry.importance <= 2 },
          ];
          const result = [];
          buckets.forEach(({ title, filter }) => {
            const items = sorted.filter(filter);
            if (items.length) {
              result.push({ title, entries: items });
            }
          });
          if (!result.length) {
            result.push({ title: "学习记录", entries: sorted });
          }
          return result;
        },
        getTopKeywords(entries, limit = 6) {
          const stats = new Map();
          entries.forEach((entry) => {
            entry.keywords.forEach((kw) => {
              stats.set(kw, (stats.get(kw) || 0) + 1);
            });
          });
          return Array.from(stats.entries())
            .sort((a, b) => {
              if (b[1] === a[1]) return a[0].localeCompare(b[0]);
              return b[1] - a[1];
            })
            .slice(0, limit)
            .map(([keyword, count]) => ({ keyword, count }));
        },
        getHighlightSentences(
          entries,
          { limit = 2, maxLength = 60, importance = 4, prefixCategory = false } = {}
        ) {
          return [...entries]
            .filter((entry) => entry.importance >= importance)
            .sort((a, b) => b.importance - a.importance || a.time.localeCompare(b.time))
            .slice(0, limit)
            .map((entry) => {
              const text = truncateText(cleanText(entry.content), maxLength);
              return prefixCategory ? `${entry.category}：${text}` : text;
            });
        },
        getCategoryConclusions(entries, categories, maxLength = 60) {
          return entries
            .filter((entry) => !categories || categories.includes(entry.category))
            .map((entry) => `• ${truncateText(getFirstSentence(entry.content), maxLength)}`);
        },
        getCategoryHeatmap(entries) {
          const stats = new Map();
          entries.forEach((entry) => {
            stats.set(entry.category, (stats.get(entry.category) || 0) + 1);
          });
          return CATEGORIES.filter((category) => stats.has(category))
            .map((category) => ({ category, count: stats.get(category) }))
            .sort((a, b) => {
              if (b.count === a.count) {
                return CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category);
              }
              return b.count - a.count;
            })
            .map(({ category, count }) => `${category}×${count}`);
        },
        getActionLines(entries, limit = 2, maxLength = 60) {
          return [...entries]
            .filter((entry) => entry.publishable)
            .sort((a, b) => b.importance - a.importance || a.time.localeCompare(b.time))
            .slice(0, limit)
            .map((entry) => truncateText(cleanText(entry.content), maxLength));
        },
        extractFirstSentence(text, maxLength = 60) {
          return truncateText(getFirstSentence(text), maxLength);
        },
      };

      const DailyRenderer = {
        /**
         * 渲染日常模板为 Markdown 或 HTML。
         * @param {"markdown"|"html"} format
         * @param {{forPreview?: boolean, entries?: Entry[]}} [options]
         * @returns {string}
         */
        render(format, { forPreview = false, entries: providedEntries } = {}) {
          const entries = providedEntries || getProcessedPublishableEntries();
          if (!entries.length) return "";
          const template = TEMPLATE_PRESETS[state.templateId] || TEMPLATE_PRESETS.minimal;
          const ctx = this.createContext(entries);
          const summaryLines = template.buildSummary(ctx, TemplateHelpers);
          const groups = template.groupEntries(ctx, TemplateHelpers);
          const title = template.getTitle(ctx);
          const subtitle = template.getSubtitle(ctx);
          const cta = template.getCTA ? template.getCTA(ctx) : "";

          if (format === "markdown") {
            const lines = [];
            lines.push(`# ${title}`);
            if (subtitle) {
              const prefix = template.markdownSubtitlePrefix || "";
              lines.push(prefix ? `${prefix}${subtitle}` : subtitle);
            }
            lines.push("");
            summaryLines.forEach((line) => lines.push(line));
            lines.push("");
            groups.forEach((group) => {
              lines.push(`## ${group.title}`);
              lines.push("");
              group.entries.forEach((entry) => {
                const rendered = template.renderEntry(ctx, entry, TemplateHelpers);
                lines.push(rendered.meta.trim());
                lines.push("");
                rendered.blocks.forEach((block) => {
                  if (block.type === "code") {
                    lines.push("```");
                    lines.push(block.text);
                    lines.push("```");
                    lines.push("");
                  } else if (block.type === "list") {
                    block.items.forEach((item) => lines.push(`- ${item}`));
                    lines.push("");
                  } else {
                    lines.push(block.text);
                    lines.push("");
                  }
                });
              });
            });
            if (cta) {
              lines.push(cta);
            }
            return lines.join("\n").trim();
          }

          const parts = [];
          const titleTag = template.titleTag || "h1";
          parts.push(`<${titleTag}>${escapeHtml(title)}</${titleTag}>`);
          if (subtitle) {
            const subtitleTag = template.subtitleTag || "p";
            const subtitleContent = escapeHtml(subtitle);
            if (template.subtitleStrong) {
              parts.push(`<${subtitleTag}><strong>${subtitleContent}</strong></${subtitleTag}>`);
            } else {
              parts.push(`<${subtitleTag}>${subtitleContent}</${subtitleTag}>`);
            }
          }
          summaryLines.forEach((line) => {
            if (state.templateId === "minimal" && line.startsWith("可复用结论：")) {
              const content = line.replace("可复用结论：", "").trim();
              if (!content || content === "-") {
                parts.push(`<p>可复用结论：-</p>`);
              } else {
                const bullets = content.split("；").filter(Boolean);
                parts.push(`<p>可复用结论：</p>`);
                parts.push(
                  "<ul>" +
                    bullets
                      .map((item) => `<li>${escapeHtml(item.replace(/^•\s*/, ""))}</li>`)
                      .join("") +
                    "</ul>"
                );
              }
            } else {
              parts.push(`<p>${escapeHtml(line)}</p>`);
            }
          });
          groups.forEach((group) => {
            parts.push(`<h2>${escapeHtml(group.title)}</h2>`);
            group.entries.forEach((entry) => {
              const rendered = template.renderEntry(ctx, entry, TemplateHelpers);
              if (forPreview) {
                const flags = entry.detectionFlags || [];
                const flagTip = flags.length ? escapeHtml(flags.join("、")) : "";
                const classes = flags.length
                  ? "preview-entry has-warning"
                  : "preview-entry";
                parts.push(`<div class="${classes}">`);
                if (flags.length) {
                  const warningText = escapeHtml(SENSITIVE_WARNING_TEXT);
                  const titleAttr = flagTip ? ` title="可能命中：${flagTip}"` : "";
                  parts.push(
                    `<div class="preview-entry-warning"${titleAttr}>⚠️ ${warningText}</div>`
                  );
                }
                parts.push(`<p><strong>${escapeHtml(rendered.meta)}</strong></p>`);
                rendered.blocks.forEach((block) => {
                  if (block.type === "code") {
                    parts.push(`<pre><code>${escapeHtml(block.text)}</code></pre>`);
                  } else if (block.type === "list") {
                    parts.push(
                      "<ul>" +
                        block.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("") +
                        "</ul>"
                    );
                  } else {
                    parts.push(`<p>${escapeHtml(block.text)}</p>`);
                  }
                });
                parts.push(`</div>`);
              } else {
                parts.push(`<p><strong>${escapeHtml(rendered.meta)}</strong></p>`);
                rendered.blocks.forEach((block) => {
                  if (block.type === "code") {
                    parts.push(`<pre><code>${escapeHtml(block.text)}</code></pre>`);
                  } else if (block.type === "list") {
                    parts.push(
                      "<ul>" +
                        block.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("") +
                        "</ul>"
                    );
                  } else {
                    parts.push(`<p>${escapeHtml(block.text)}</p>`);
                  }
                });
              }
            });
          });
          if (cta) {
            parts.push(`<p>${escapeHtml(cta)}</p>`);
          }
          const html = parts.join("\n");
          return forPreview ? html : html.trim();
        },
        /**
         * 构建 Markdown 输出。
         * @param {Entry[]} entries
         * @returns {string}
         */
        buildMarkdown(entries) {
          return this.render("markdown", { entries });
        },
        /**
         * 构建 HTML 输出。
         * @param {boolean} forPreview
         * @param {Entry[]} entries
         * @returns {string}
         */
        buildHTML(forPreview = false, entries) {
          return this.render("html", { forPreview, entries });
        },
        /**
         * 构建模板渲染上下文。
         * @param {Entry[]} entries
         * @returns {{dateTitle: string, entries: Entry[]}}
         */
        createContext(entries) {
          return {
            dateTitle: DateUtils.toTitle(
              state.currentDoc.date || DateUtils.toISODate(new Date())
            ),
            entries: TemplateHelpers.sortEntries(entries),
          };
        },
      };

      const WeeklyRenderer = {
        /**
         * 构建周报上下文。
         * @param {Entry[]} entries
         * @param {string[]} sortedDates
         * @returns {{title: string, subtitle: string, summaryLines: string[], groups: any[], toc: any[], period: {start: string, end: string}, entries: Entry[]}}
         */
        buildContext(entries, sortedDates) {
          if (!sortedDates.length) {
            return {
              title: "我的学习周报",
              subtitle: "AI+财税+运营｜跨天复盘笔记",
              summaryLines: this.buildSummaryLines(entries),
              groups: [],
              toc: [],
              period: { start: "", end: "" },
              entries,
            };
          }
          const start = sortedDates[0];
          const end = sortedDates[sortedDates.length - 1];
          const title = `我的学习周报｜${DateUtils.toTitle(start)}-${DateUtils.toTitle(end)}`;
          const subtitle = "AI+财税+运营｜跨天复盘笔记";
          const summaryLines = this.buildSummaryLines(entries);
          const groups = [];
          sortedDates.forEach((date) => {
            const dayEntries = entries.filter((entry) => entry.date === date);
            if (!dayEntries.length) return;
            const categories = [];
            CATEGORIES.forEach((category) => {
              const list = dayEntries
                .filter((entry) => entry.category === category)
                .sort(
                  (a, b) =>
                    b.importance - a.importance || a.time.localeCompare(b.time)
                );
              if (!list.length) return;
              categories.push({
                name: category,
                entries: list.map((entry) => ({
                  ...entry,
                  meta: `【${entry.category}】（${entry.time}） 关键词 ${TemplateHelpers.formatTagLine(entry.keywords)}`,
                  blocks: TemplateHelpers.parseBlocks(entry.content),
                })),
              });
            });
            if (!categories.length) return;
            groups.push({
              date,
              label: DateUtils.toTitle(date),
              anchor: `date-${date}`,
              categories,
            });
          });
          const toc = groups.map((group) => ({ label: group.label, anchor: group.anchor }));
          return { title, subtitle, summaryLines, groups, toc, period: { start, end }, entries };
        },
        /**
         * 构建周报摘要三行。
         * @param {Entry[]} entries
         * @returns {string[]}
         */
        buildSummaryLines(entries) {
          if (!entries.length) {
            return [
              "关键词Top10：-",
              "重要亮点Top5：-",
              "结论要点Top5：-",
            ];
          }
          const keywords = TemplateHelpers.getTopKeywords(entries, 10).map((item) => item.keyword);
          const highlights = this.getHighlights(entries, 5);
          const conclusions = this.getConclusions(entries, 5);
          return [
            `关键词Top10：${keywords.length ? keywords.join("、") : "-"}`,
            `重要亮点Top5：${highlights.length ? highlights.join("；") : "-"}`,
            `结论要点Top5：${conclusions.length ? conclusions.join("；") : "-"}`,
          ];
        },
        /**
         * 选取高亮语句。
         * @param {Entry[]} entries
         * @param {number} limit
         * @returns {string[]}
         */
        getHighlights(entries, limit) {
          const seen = new Set();
          const result = [];
          const sorted = [...entries].sort(
            (a, b) =>
              b.importance - a.importance ||
              a.date.localeCompare(b.date) ||
              a.time.localeCompare(b.time)
          );
          for (const entry of sorted) {
            if (result.length >= limit) break;
            const text = truncateText(
              cleanText(entry.baseContent || entry.content || ""),
              60
            );
            if (!text) continue;
            if (seen.has(text)) continue;
            seen.add(text);
            result.push(`${entry.category}：${text}`);
          }
          return result.slice(0, limit);
        },
        /**
         * 选取结论要点。
         * @param {Entry[]} entries
         * @param {number} limit
         * @returns {string[]}
         */
        getConclusions(entries, limit) {
          const seen = new Set();
          const result = [];
          entries
            .filter((entry) => SUMMARY_PRIMARY_CATEGORIES.includes(entry.category))
            .sort(
              (a, b) =>
                b.importance - a.importance ||
                a.date.localeCompare(b.date) ||
                a.time.localeCompare(b.time)
            )
            .forEach((entry) => {
              if (result.length >= limit) return;
              const sentence = truncateText(
                getFirstSentence(entry.baseContent || entry.content || ""),
                60
              );
              if (!sentence || seen.has(sentence)) return;
              seen.add(sentence);
              result.push(`• ${sentence}`);
            });
          return result.slice(0, limit);
        },
        /**
         * 生成周报 Markdown。
         * @param {ReturnType<WeeklyRenderer["buildContext"]>} ctx
         * @returns {string}
         */
        buildMarkdown(ctx) {
          const lines = [];
          lines.push(`# ${ctx.title}`);
          if (ctx.subtitle) {
            lines.push(`## ${ctx.subtitle}`);
          }
          lines.push("");
          ctx.summaryLines.forEach((line) => {
            lines.push(line);
          });
          lines.push("");
          if (ctx.toc.length) {
            lines.push("## 小目录");
            lines.push("");
            ctx.toc.forEach((item) => {
              lines.push(`- [${item.label}](#${item.anchor})`);
            });
            lines.push("");
          }
          ctx.groups.forEach((group) => {
            lines.push(`## ${group.label}`);
            lines.push("");
            group.categories.forEach((category) => {
              lines.push(`### ${category.name}`);
              lines.push("");
              category.entries.forEach((entry) => {
                lines.push(`**${entry.meta.trim()}**`);
                lines.push("");
                entry.blocks.forEach((block) => {
                  if (block.type === "code") {
                    lines.push("```");
                    lines.push(block.text);
                    lines.push("```");
                    lines.push("");
                  } else if (block.type === "list") {
                    block.items.forEach((item) => lines.push(`- ${item}`));
                    lines.push("");
                  } else {
                    lines.push(block.text);
                    lines.push("");
                  }
                });
              });
            });
          });

      const SafetyService = {
        /**
         * 将内容转为口语化表达。
         * @param {string} text
         * @returns {string}
         */
        transform(text) {
          if (!text) return "";
          const normalized = cleanText(String(text))
            .replace(/[\r\n]+/g, "。")
            .replace(/[；;]/g, "，");
          if (!normalized) return "";
          const connectors = ["先是", "然后", "所以", "接着", "另外", "最后", "但"];
          let connectorIndex = 0;
          const pieces = [];

          const addConnector = (snippet) => {
            const needsConnector = !/^(先是|然后|所以|接着|另外|最后|但|不过|因此|于是)/.test(snippet);
            if (!needsConnector) return snippet;
            const connector = connectors[connectorIndex % connectors.length];
            connectorIndex += 1;
            return `${connector}${snippet}`;
          };

          const splitByLength = (value, maxLength) => {
            const chars = Array.from(value);
            if (!chars.length) return [];
            const result = [];
            for (let i = 0; i < chars.length; i += maxLength) {
              result.push(chars.slice(i, i + maxLength).join(""));
            }
            return result;
          };

          const softenPhrase = (phrase) => {
            return phrase
              .replace(/([\u4e00-\u9fa5]{2,})(流程|策略|方案|系统|模型|指标|计划|工具)/g, "$1的$2")
              .replace(/(客户|供应链|业务)(增长|拉新|分析|管理)/g, "$1的$2");
          };

          const sentences = normalized
            .split(/[。!?！？]/)
            .map((segment) => segment.trim())
            .filter(Boolean);

          sentences.forEach((sentence) => {
            const fragments = sentence
              .split(/[，,]/)
              .map((fragment) => fragment.trim())
              .filter(Boolean);
            fragments.forEach((fragment) => {
              const softened = softenPhrase(fragment).replace(/、/g, "，");
              splitByLength(softened, 20).forEach((part) => {
                const trimmed = part.trim();
                if (!trimmed) return;
                pieces.push(addConnector(trimmed));
              });
            });
          });

          const output = pieces.join("。");
          if (!output) return "";
          return /[。!?！？]$/.test(output) ? output : `${output}。`;
        },
        /**
         * 检测可能的敏感信息。
         * @param {string} text
         * @returns {{flags: string[]}}
         */
        detect(text) {
          if (!text) return { flags: [] };
          const source = String(text);
          const flags = new Set();
          if (/(订单号|合同号|流水号|客户号|发票号)[^\n\r]{0,16}[A-Za-z0-9-]{4,}/i.test(source)) {
            flags.add("编号");
          }
          if (/[\w.+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.test(source)) {
            flags.add("邮箱");
          }
          if (/\b1[3-9]\d{9}\b/.test(source) || /\b\d{3,4}-\d{7,8}\b/.test(source)) {
            flags.add("电话");
          }
          if (
            /(客户[\u4e00-\u9fa5]{2,4})/.test(source) ||
            /[\u4e00-\u9fa5]{2,}(集团|股份有限公司|有限责任公司|有限公司|科技|信息|银行|大学|研究院|中心|医院|传媒|物流|供应链|咨询|设计|平台|研究所|学院|公司)/.test(
              source
            )
          ) {
            flags.add("客户");
          }
          const amountPattern = /(￥|\$|人民币|rmb|usd|美元)?\s*\d{4,}(?:,\d{3})*(?:\.\d+)?\s*(元|块|人民币|rmb|usd|美元|万|亿|万元|亿元)?/i;
          const unitAmountPattern = /\d+(?:\.\d+)?\s*(万|亿)(元|人民币|usd|美元)?/i;
          if (amountPattern.test(source) || unitAmountPattern.test(source)) {
            flags.add("金额");
          }
          return { flags: Array.from(flags) };
        },
        /**
         * 模糊化文本中的金额与客户信息。
         * @param {string} text
         * @returns {string}
         */
        applyFuzzing(text) {
          if (!text) return "";
          let result = String(text);
          const amountRegex = /(￥|\$|人民币|rmb|usd|美元)?\s*(\d{5,}(?:,\d{3})*(?:\.\d+)?)(元|块|人民币|rmb|usd|美元|万元|亿元|万|亿)?/gi;
          result = result.replace(amountRegex, (match, _symbol, numberPart, unitPart = "") => {
            const replacement = SafetyService.formatApproximateAmount(numberPart, unitPart);
            return replacement || match;
          });
          result = result.replace(/(\d+(?:\.\d+)?)(万|亿)(元|人民币|usd|美元)?/gi, (match, numberPart, unitPart) => {
            const replacement = SafetyService.formatApproximateAmount(numberPart, unitPart);
            return replacement || match;
          });
          const companyRegex = /([\u4e00-\u9fa5])([\u4e00-\u9fa5]{1,6})(集团|股份有限公司|有限责任公司|有限公司|科技|信息|银行|大学|研究院|中心|医院|传媒|物流|供应链|咨询|设计|平台|研究所|学院|公司)/g;
          result = result.replace(companyRegex, (match, first, _rest, suffix) => `${first}**${suffix}`);
          result = result.replace(/客户([\u4e00-\u9fa5])([\u4e00-\u9fa5]{1,3})(?=[\s，,。.；;]|$)/g, (match, first) => `客户${first}**`);
          return result;
        },
        formatApproximateAmount(numberPart, unitPart = "") {
          const sanitized = numberPart.replace(/,/g, "");
          if (!sanitized) return null;
          if (/^1\d{10}$/.test(sanitized)) return null;
          const numeric = Number(sanitized);
          if (!Number.isFinite(numeric) || numeric <= 0) return null;
          const digits = sanitized.replace(/\D/g, "");
          const unit = unitPart ? unitPart.toLowerCase() : "";
          if (!unit && digits.length < 5) {
            return null;
          }
          if (unit.includes("亿")) {
            const approx = Math.max(1, Math.round(numeric));
            return `约${approx}亿+`;
          }
          if (unit.includes("万")) {
            const approx = Math.max(1, Math.round(numeric));
            return `约${approx}万+`;
          }
          if (unit && /元|人民币|rmb|usd|美元|块/.test(unit)) {
            if (numeric >= 1e8) {
              return `约${Math.round(numeric / 1e8)}亿+`;
            }
            if (numeric >= 1e4) {
              return `约${Math.round(numeric / 1e4)}万+`;
            }
            if (numeric >= 1e3) {
              return `约${Math.round(numeric / 1e3)}千+`;
            }
            if (numeric >= 100) {
              return `约${Math.round(numeric)}+`;
            }
            return null;
          }
          if (numeric >= 1e8) {
            return `约${Math.round(numeric / 1e8)}亿+`;
          }
          if (numeric >= 1e4) {
            return `约${Math.round(numeric / 1e4)}万+`;
          }
          if (numeric >= 1e3) {
            return `约${Math.round(numeric / 1e3)}千+`;
          }
          return null;
        },
      };

      function formatContentForMarkdown(content) {
        const normalized = content.replace(/\r\n?/g, "\n");
        const lines = normalized.split("\n");
        const result = [];
        let blankStreak = 0;
        let inCode = false;
        for (const rawLine of lines) {
          const trimmedRight = rawLine.replace(/\s+$/g, "");
          const isBlank = trimmedRight.trim() === "";
          const isCodeLine =
            /^\s{4,}/.test(rawLine) ||
            (!/[\u4e00-\u9fa5]/.test(trimmedRight) && /[;{}=<>]/.test(trimmedRight));

          if (isBlank) {
            blankStreak += 1;
            if (blankStreak <= 1 && !inCode) {
              result.push("");
            }
            continue;
          } else {
            blankStreak = 0;
          }

          if (isCodeLine && !inCode) {
            result.push("```");
            inCode = true;
          }
          if (!isCodeLine && inCode) {
            result.push("```");
            inCode = false;
          }

          result.push(inCode ? trimmedRight : trimmedRight.trim());
        }
        if (inCode) {
          result.push("```");
        }
        const cleaned = [];
        let previousEmpty = false;
        for (const line of result) {
          if (line === "") {
            if (!previousEmpty) {
              cleaned.push(line);
            }
            previousEmpty = true;
          } else {
            cleaned.push(line);
            previousEmpty = false;
          }
        }
        return cleaned.join("\n").trim();
      }

      function parseContentBlocks(processedContent) {
        const lines = processedContent.split("\n");
        const blocks = [];
        let inCode = false;
        let buffer = [];
        for (const line of lines) {
          if (line.trim() === "```") {
            if (inCode) {
              blocks.push({ type: "code", text: buffer.join("\n") });
              buffer = [];
              inCode = false;
            } else {
              if (buffer.length) {
                blocks.push({ type: "paragraph", text: buffer.join(" ").trim() });
                buffer = [];
              }
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            buffer.push(line);
          } else if (line.trim() === "") {
            if (buffer.length) {
              blocks.push({ type: "paragraph", text: buffer.join(" ").trim() });
              buffer = [];
            }
          } else {
            buffer.push(line.trim());
          }
        }
        if (buffer.length) {
          blocks.push({ type: inCode ? "code" : "paragraph", text: buffer.join(inCode ? "\n" : " ").trim() });
        }
        return blocks;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")

      function showStatus(message, type = "info") {
        if (state.statusTimer) {
          clearTimeout(state.statusTimer);
        }
        statusMessage.textContent = message;
        const colors = {
          success: "var(--success)",
          warning: "var(--warning)",
          danger: "var(--danger)",
          info: "var(--muted)",
        };
        statusMessage.style.color = colors[type] || "var(--muted)";
        state.statusTimer = setTimeout(() => {
          statusMessage.textContent = "";
          statusMessage.style.color = "var(--muted)";
        }, 3200);
      }

      function copyToClipboard(text) {
        if (!text) {
          showStatus("暂无可复制的内容", "warning");
          return;
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => showStatus("已复制到剪贴板", "success"))
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          showStatus("已复制到剪贴板", "success");
        } catch (error) {
          showStatus("复制失败，请手动复制", "danger");
        }
        document.body.removeChild(textarea);
      }

      function downloadFile(content, filename, mime = "text/plain") {
        if (!content) {
          showStatus("暂无可导出的内容", "warning");
          return;
        }
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showStatus(`已导出 ${filename}`, "success");
      }

      // —— 关闭实现：兼容 <dialog> 与自定义 <div> —— //
      function closeSettingsModal() {
        const modal = document.getElementById("settingsModal");
        const overlay = document.getElementById("settingsOverlay");
        const mask =
          document.getElementById("settingsMask") ||
          (overlay instanceof HTMLElement ? overlay : null);
        if (!modal && !overlay && !mask) {
          logS("modal not found");
          return;

        if (modal && typeof modal.close === "function") {
          try {
            modal.close();

          } catch (error) {

          }
        }
        if (modal) {
          modal.classList.remove("is-open", "open", "show", "visible");
          modal.style.removeProperty("display");
        }
        if (overlay) {
          overlay.hidden = true;
          overlay.classList.remove("is-open", "open", "show", "visible");
          overlay.style.display = "none";

        if (mask && mask !== overlay) {
          mask.hidden = true;
          mask.classList.remove("is-open", "open", "show", "visible");
          mask.style.display = "none";
        }
        document.body.classList.remove("modal-open");

          try {

      // —— 打开时可能是动态插入：强绑定 + 事件委托双保险 —— //
      (function bindSettingsModal() {
        document.body.addEventListener("click", (event) => {
          const trigger = event.target.closest('[data-action="settings-close"]');
          if (!trigger) return;
          event.preventDefault();
          event.stopPropagation();
          logS("delegate action: settings-close");
          closeSettingsModal();
        });

        function hardBind() {
          const modal = document.getElementById("settingsModal");
          if (!modal) {
            logS("hardBind: modal not found");
            return;
          }

          const closeBtn =
            modal.querySelector('[data-action="settings-close"]') ||
            Array.from(modal.querySelectorAll("button,.btn,[role='button']")).find(
              (el) => /关\s*闭/.test(el.textContent || "")
            );

                event.preventDefault();
                event.stopPropagation();
                closeSettingsModal();
              });
              closeBtn.dataset.settingsBoundClose = "1";
            }
            logS("hardBind: close button bound");
          } else {
            logS("hardBind: close button not found");
          }

          const mask =
            document.getElementById("settingsMask") ||
            document.getElementById("settingsOverlay");
          if (mask && !mask.dataset.settingsBoundMask) {
            mask.addEventListener("click", (event) => {
              if (event.target === mask) {
                event.preventDefault();
                closeSettingsModal();
              }
            });
            mask.dataset.settingsBoundMask = "1";
            logS("hardBind: mask click bound");
          } else if (!mask) {
            logS("hardBind: mask not found");
          }
        }

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            const modal = document.getElementById("settingsModal");
            const overlay = document.getElementById("settingsOverlay");
            const visibleOverlay =
              overlay &&
              (overlay.hidden === false ||
                getComputedStyle(overlay).display !== "none");
            if (
              (modal && modal.open === true) ||
              visibleOverlay
            ) {
              closeSettingsModal();
              logS("ESC close");
            }
          }
        });

        document.addEventListener("DOMContentLoaded", hardBind);
        document.body.addEventListener("click", (event) => {
          const opener = event.target.closest('[data-open="settings"]');
          if (opener) {
            setTimeout(hardBind, 0);
          }
        });
      })();

        }

        const copyHtmlBtn =
          modal.querySelector('[data-action="weekly-copy-html"]') ||
          Array.from(modal.querySelectorAll("button,.btn,[role='button']")).find(
            (el) => /复制\s*HTML/i.test(el.textContent || "")
          );
        if (copyHtmlBtn) {
          copyHtmlBtn.type = "button";
          if (!copyHtmlBtn.dataset.weeklyBoundCopyHtml) {
            copyHtmlBtn.addEventListener("click", async (event) => {
              event.preventDefault();
              event.stopPropagation();
              const preview = document.getElementById("weeklyPreview");
              const html = preview?.innerHTML?.trim() || "";
              if (!html) {
                logW("hardBind copy: empty");
                alert("暂无可复制内容，请先生成预览");
                return;
              }
              const ok = await copyTextRobust(html);
              logW("hardBind copy-html result:", ok);
              if (ok) {
                toast("已复制到剪贴板", "success");
              } else {
                toast("复制失败，请手动复制", "danger");
              }
              alert(ok ? "已复制 HTML 到剪贴板" : "复制失败，请手动复制");
            });
            copyHtmlBtn.dataset.weeklyBoundCopyHtml = "1";
          }
          logW("hardBind: copy-html bound");
        } else {
          logW("hardBind: copy-html not found");
        }
      }
    </script>

  </body>
</html>
