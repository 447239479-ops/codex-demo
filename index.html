<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>长文排版成竖版海报</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNa5F20TpnULv7B+6efSdsdYDEpXzwFUTkOFjHlkikPddXQdHJvT1UKsCtL7F2Sht05HHc2+p5GY5C5m7V0Hqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-4PDP1wFafnqKXq7aj7qV3CyMfCVx/gvBy06SnVAk0nnBYnCTsRmR271GGBqBPdZiZsaAJ+lZeX7IuP89xDS3YQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" integrity="sha512-5x6G5dZL2LI4YAlnXrhIRbkIuAeGHNirMRHkRkNvztNFVQVw1Gc7YDxUMIqFZRMVAb9Y2GjzY1x04WXaQZLndA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <div class="app">
      <aside class="control-panel">
        <header class="panel-header">
          <h1>竖版海报生成器</h1>
          <p>粘贴长文，自动分页生成 3:4 图片</p>
        </header>
        <section class="panel-section">
          <label for="text-input" class="section-label">输入文本</label>
          <textarea
            id="text-input"
            placeholder="第一行：主标题\n第二行：副标题（可选）\n空行分隔小节，自动分页。"
          ></textarea>
        </section>
        <section class="panel-section two-columns">
          <div class="field">
            <label for="page-size">画布尺寸</label>
            <select id="page-size">
              <option value="1080x1440">1080 × 1440</option>
              <option value="1240x1654">1240 × 1654</option>
            </select>
          </div>
          <div class="field">
            <label for="theme-select">主题样式</label>
            <select id="theme-select">
              <option value="clean">清爽白</option>
              <option value="cream">奶油风</option>
              <option value="dark">极简黑</option>
              <option value="brand">品牌色自定义</option>
            </select>
          </div>
        </section>
        <section class="panel-section two-columns">
          <div class="field">
            <label for="font-select">字体</label>
            <select id="font-select">
              <option value="system">系统默认</option>
              <option value="serif">衬线</option>
              <option value="rounded">圆体</option>
              <option value="mono">等宽</option>
            </select>
          </div>
          <div class="field">
            <label for="brand-color">品牌主色</label>
            <input type="color" id="brand-color" value="#3366ff" />
          </div>
        </section>
        <section class="panel-section toggles">
          <label class="toggle">
            <input type="checkbox" id="cover-toggle" checked />
            <span>生成封面页</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="watermark-toggle" />
            <span>水印 / LOGO</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="page-number-toggle" checked />
            <span>显示页码</span>
          </label>
        </section>
        <section class="panel-section">
          <label for="watermark-text">水印文字（可选）</label>
          <input type="text" id="watermark-text" placeholder="例如：© MyBrand" />
        </section>
        <footer class="panel-footer">
          <button id="refresh-button" class="primary">刷新预览</button>
          <div class="download-group">
            <button id="export-png">生成全部图片 PNG</button>
            <button id="download-zip" class="secondary">下载 ZIP</button>
          </div>
        </footer>
      </aside>
      <main class="preview-panel">
        <div class="preview-header">
          <h2>实时预览</h2>
          <p>支持拖动滚动查看所有分页</p>
        </div>
        <div id="preview-container" class="preview-container"></div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
