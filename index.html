<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇小游戏</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --grid-color: #1e293b;
        --snake-head-color: #38bdf8;
        --snake-body-color: #0ea5e9;
        --food-color: #facc15;
        --text-color: #f8fafc;
        --accent-color: #22d3ee;
        --font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg-color));
        color: var(--text-color);
        font-family: var(--font-family);
        padding: 16px;
      }

      .page-wrapper {
        width: min(100%, 480px);
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .scoreboard {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.4);
      }

      .score-item {
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .game-wrapper {
        position: relative;
        width: 400px;
        max-width: 100%;
      }

      #gameCanvas {
        width: 100%;
        height: auto;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 16px 32px rgba(15, 23, 42, 0.45);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 16px;
        text-align: center;
      }

      .hidden {
        display: none;
      }

      .control-btn {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, var(--accent-color), #38bdf8);
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .control-btn:hover,
      .control-btn:focus {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(34, 211, 238, 0.35);
      }

      .control-btn:active {
        transform: translateY(1px);
      }

      .mobile-controls {
        display: grid;
        gap: 8px;
        justify-items: center;
        width: 100%;
      }

      .mobile-row {
        display: flex;
        gap: 12px;
      }

      .direction-btn {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 2px solid rgba(148, 163, 184, 0.4);
        background: rgba(15, 23, 42, 0.65);
        color: var(--text-color);
        font-size: 1.5rem;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .direction-btn:active {
        background: rgba(56, 189, 248, 0.25);
        transform: scale(0.95);
      }

      @media (hover: none) {
        .control-btn:hover,
        .direction-btn:hover {
          transform: none;
          box-shadow: none;
        }
      }

      @media (max-width: 480px) {
        .scoreboard {
          flex-direction: column;
          gap: 8px;
        }

        .direction-btn {
          width: 56px;
          height: 56px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="scoreboard">
        <div class="score-item">当前分数：<span id="score">0</span></div>
        <div class="score-item">最高分：<span id="highScore">0</span></div>
        <button id="pauseBtn" class="control-btn" type="button">暂停</button>
      </header>

      <main class="game-wrapper">
        <canvas
          id="gameCanvas"
          width="400"
          height="400"
          aria-label="贪吃蛇游戏画布"
        ></canvas>
        <div id="gameOverlay" class="overlay hidden" role="alert">
          <p id="overlayMessage"></p>
          <button id="restartBtn" class="control-btn" type="button">
            重新开始
          </button>
        </div>
      </main>

      <section class="mobile-controls" aria-label="触屏方向控制">
        <div class="mobile-row">
          <button class="direction-btn" data-direction="up" aria-label="向上">
            ▲
          </button>
        </div>
        <div class="mobile-row">
          <button class="direction-btn" data-direction="left" aria-label="向左">
            ◀
          </button>
          <button class="direction-btn" data-direction="down" aria-label="向下">
            ▼
          </button>
          <button class="direction-btn" data-direction="right" aria-label="向右">
            ▶
          </button>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        GRID_SIZE: 20,
        CELL_SIZE: 20,
        BASE_SPEED: 8,
        SPEED_INCREMENT: 0.35,
        MAX_SPEED: 14,
        STORAGE_KEY: 'snakeHighScore'
      };

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const highScoreEl = document.getElementById('highScore');
      const overlay = document.getElementById('gameOverlay');
      const overlayMessage = document.getElementById('overlayMessage');
      const restartBtn = document.getElementById('restartBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const mobileButtons = document.querySelectorAll('.direction-btn');

      let snake = [];
      let direction = { x: 1, y: 0 };
      let nextDirection = { x: 1, y: 0 };
      let food = { x: 0, y: 0 };
      let score = 0;
      let highScore = Number(localStorage.getItem(CONFIG.STORAGE_KEY)) || 0;
      let running = false;
      let paused = false;
      let lastUpdate = 0;

      highScoreEl.textContent = highScore.toString();

      function initGame() {
        const centerX = Math.floor(CONFIG.GRID_SIZE / 2);
        const centerY = Math.floor(CONFIG.GRID_SIZE / 2);

        snake = [
          { x: centerX + 1, y: centerY },
          { x: centerX, y: centerY },
          { x: centerX - 1, y: centerY }
        ];

        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        paused = false;
        running = true;
        lastUpdate = 0;

        updateScoreBoard();
        spawnFood();
        overlay.classList.add('hidden');
        overlayMessage.textContent = '';
        pauseBtn.textContent = '暂停';

        draw();
        requestAnimationFrame(gameLoop);
      }

      function gameLoop(timestamp) {
        if (!running) {
          return;
        }

        requestAnimationFrame(gameLoop);

        if (paused) {
          return;
        }

        if (!lastUpdate) {
          lastUpdate = timestamp;
        }

        const frameInterval = getFrameInterval();
        if (timestamp - lastUpdate >= frameInterval) {
          update();
          draw();
          lastUpdate = timestamp;
        }
      }

      function getFrameInterval() {
        const stepsPerSecond = Math.min(
          CONFIG.MAX_SPEED,
          CONFIG.BASE_SPEED + score * CONFIG.SPEED_INCREMENT
        );
        return 1000 / stepsPerSecond;
      }

      function update() {
        direction = nextDirection;
        const newHead = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };

        if (isCollision(newHead)) {
          endGame();
          return;
        }

        snake.unshift(newHead);

        if (newHead.x === food.x && newHead.y === food.y) {
          score += 1;
          updateHighScore();
          updateScoreBoard();
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function draw() {
        drawBackground();
        drawFood();
        drawSnake();
      }

      function drawBackground() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
        ctx.lineWidth = 1;

        for (let i = 1; i < CONFIG.GRID_SIZE; i += 1) {
          const position = i * CONFIG.CELL_SIZE;
          ctx.beginPath();
          ctx.moveTo(position, 0);
          ctx.lineTo(position, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, position);
          ctx.lineTo(canvas.width, position);
          ctx.stroke();
        }
      }

      function drawSnake() {
        snake.forEach((segment, index) => {
          const x = segment.x * CONFIG.CELL_SIZE;
          const y = segment.y * CONFIG.CELL_SIZE;

          ctx.fillStyle = index === 0 ? '#38bdf8' : '#0ea5e9';
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
          ctx.lineWidth = 2;

          const rectX = x + 2;
          const rectY = y + 2;
          const rectSize = CONFIG.CELL_SIZE - 4;

          ctx.beginPath();
          if (typeof ctx.roundRect === 'function') {
            ctx.roundRect(rectX, rectY, rectSize, rectSize, 6);
          } else {
            ctx.rect(rectX, rectY, rectSize, rectSize);
          }
          ctx.fill();
          ctx.stroke();
        });
      }

      function drawFood() {
        const x = food.x * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const y = food.y * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
        const radius = (CONFIG.CELL_SIZE / 2) * 0.7;

        const gradient = ctx.createRadialGradient(x - 3, y - 3, 3, x, y, radius);
        gradient.addColorStop(0, '#fef08a');
        gradient.addColorStop(1, '#facc15');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function spawnFood() {
        let newFood;
        do {
          newFood = {
            x: Math.floor(Math.random() * CONFIG.GRID_SIZE),
            y: Math.floor(Math.random() * CONFIG.GRID_SIZE)
          };
        } while (
          snake.some(
            (segment) => segment.x === newFood.x && segment.y === newFood.y
          )
        );

        food = newFood;
      }

      function isCollision(headPosition) {
        const { x, y } = headPosition;
        const hitWall =
          x < 0 ||
          y < 0 ||
          x >= CONFIG.GRID_SIZE ||
          y >= CONFIG.GRID_SIZE;

        if (hitWall) {
          return true;
        }

        return snake.some(
          (segment) => segment.x === headPosition.x && segment.y === headPosition.y
        );
      }

      function updateScoreBoard() {
        scoreEl.textContent = score.toString();
        highScoreEl.textContent = highScore.toString();
      }

      function updateHighScore() {
        if (score > highScore) {
          highScore = score;
          localStorage.setItem(CONFIG.STORAGE_KEY, highScore.toString());
        }
      }

      function endGame() {
        running = false;
        overlayMessage.textContent = `Game Over! 分数：${score}`;
        overlay.classList.remove('hidden');
        pauseBtn.textContent = '开始';
      }

      function togglePause() {
        if (!running) {
          return;
        }

        paused = !paused;
        pauseBtn.textContent = paused ? '继续' : '暂停';
      }

      function setDirectionFromInput(dir) {
        const directionVectors = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };

        const newDirection = directionVectors[dir];
        if (!newDirection) {
          return;
        }

        const isOpposite =
          newDirection.x === -direction.x && newDirection.y === -direction.y;

        if (!isOpposite) {
          nextDirection = newDirection;
        }
      }

      function handleKeydown(event) {
        const { key } = event;

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
          event.preventDefault();
        }

        switch (key) {
          case 'ArrowUp':
            setDirectionFromInput('up');
            break;
          case 'ArrowDown':
            setDirectionFromInput('down');
            break;
          case 'ArrowLeft':
            setDirectionFromInput('left');
            break;
          case 'ArrowRight':
            setDirectionFromInput('right');
            break;
          case 'p':
          case 'P':
            togglePause();
            break;
          case 'r':
          case 'R':
            if (!running) {
              initGame();
            }
            break;
          default:
            break;
        }
      }

      function handleDirectionButton(event) {
        const dir = event.currentTarget.dataset.direction;
        setDirectionFromInput(dir);
      }

      restartBtn.addEventListener('click', initGame);
      pauseBtn.addEventListener('click', () => {
        if (!running) {
          initGame();
        } else {
          togglePause();
        }
      });
      window.addEventListener('keydown', handleKeydown);
      mobileButtons.forEach((button) => {
        button.addEventListener('click', handleDirectionButton);
        button.addEventListener('touchstart', (event) => {
          event.preventDefault();
          setDirectionFromInput(button.dataset.direction);
        });
      });

      initGame();
    </script>
  </body>
</html>
