<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本排版导出工具</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #6366f1;
        --accent-strong: #7c3aed;
        --accent-soft: rgba(99, 102, 241, 0.18);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
        background: radial-gradient(circle at top, #f7f4ef, #ebe6df);
        font-family: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei',
          system-ui, sans-serif;
        color: #1f2937;
      }

      main {
        width: min(1140px, 100%);
        display: grid;
        gap: 32px;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 48px rgba(31, 41, 55, 0.12);
        backdrop-filter: blur(6px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        border-radius: 18px;
        border: 1px solid #d1d5db;
        padding: 16px 20px;
        font-size: 1rem;
        line-height: 1.6;
        font-family: 'LXGW WenKai Screen', 'Noto Serif SC', 'Source Han Serif SC',
          'Songti SC', 'PingFang SC', 'Microsoft YaHei', serif;
        color: #1f2937;
        background: rgba(248, 250, 252, 0.9);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .settings-grid {
        margin-top: 20px;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.95rem;
        color: #4b5563;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field-label {
        font-weight: 600;
        color: #374151;
      }

      select,
      input[type='color'],
      input[type='text'],
      input[type='range'] {
        border-radius: 14px;
        border: 1px solid #d1d5db;
        padding: 10px 14px;
        font-size: 0.95rem;
        font-family: inherit;
        color: #1f2937;
        background: rgba(255, 255, 255, 0.92);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type='color'] {
        height: 44px;
        padding: 4px;
      }

      input[type='range'] {
        padding: 0;
        height: 36px;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .range-value {
        font-size: 0.85rem;
        color: #6b7280;
      }

      .cover-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #d1d5db;
        background: rgba(248, 250, 252, 0.8);
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .cover-toggle input {
        width: 18px;
        height: 18px;
      }

      .cover-toggle:hover,
      .cover-toggle:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .logo-controls {
        display: grid;
        gap: 10px;
      }

      .logo-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .logo-preview {
        width: 100%;
        height: 120px;
        border: 1px dashed #d1d5db;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.85rem;
        color: #9ca3af;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      .logo-preview.has-logo {
        border-style: solid;
        border-color: var(--accent);
        color: transparent;
      }

      .button-compact {
        padding: 8px 18px;
        font-size: 0.9rem;
      }

      .controls {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
        gap: 16px;
      }

      .dimension {
        font-size: 0.95rem;
        color: #4b5563;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button-secondary {
        background: rgba(99, 102, 241, 0.12);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .button-secondary:hover,
      .button-secondary:focus {
        box-shadow: inset 0 0 0 1px var(--accent), 0 10px 18px var(--accent-soft);
      }

      button:hover,
      button:focus {
        transform: translateY(-1px);
        box-shadow: 0 16px 24px var(--accent-soft);
        outline: none;
      }

      .error-message {
        margin: 0;
        font-size: 0.9rem;
        color: #b91c1c;
        background: rgba(248, 113, 113, 0.15);
        border-radius: 14px;
        padding: 10px 14px;
      }

      .self-tests {
        font-size: 0.85rem;
        color: #0c4a6e;
        background: rgba(224, 242, 254, 0.68);
        border-radius: 14px;
        padding: 12px 16px;
        border: 1px solid rgba(14, 116, 144, 0.2);
      }

      .self-tests.fail {
        color: #9f1239;
        background: rgba(254, 226, 226, 0.7);
        border-color: rgba(185, 28, 28, 0.25);
      }

      .self-tests strong {
        color: inherit;
      }

      .preview-wrapper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .preview-container {
        display: grid;
        gap: 24px;
        width: 100%;
        justify-items: center;
      }

      .preview-card {
        position: relative;
        padding: 20px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 32px 56px rgba(15, 23, 42, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(100%, 420px);
      }

      canvas {
        display: block;
        width: min(100%, 380px);
        height: auto;
        max-height: 520px;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.25);
      }

      .page-label {
        font-size: 0.9rem;
        color: #4b5563;
      }

      .hint {
        font-size: 0.9rem;
        color: #6b7280;
        text-align: center;
        line-height: 1.6;
      }

      .is-hidden {
        display: none !important;
      }

      @media (max-width: 720px) {
        body {
          padding: 24px 12px;
        }

        .panel {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>文本排版输入</h1>
        <textarea id="textInput" placeholder="在此输入要排版的正文内容…"></textarea>
        <div class="settings-grid">
          <label class="field">
            <span class="field-label">主题</span>
            <select id="themeSelect">
              <option value="classic">经典米色</option>
              <option value="ink">极简墨黑</option>
              <option value="dawn">晨曦粉橙</option>
              <option value="forest">书卷青绿</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">主色</span>
            <input type="color" id="primaryColor" value="#6366f1" />
          </label>
          <label class="field">
            <span class="field-label">正文字号</span>
            <input type="range" id="fontSize" min="36" max="72" value="52" />
            <span class="range-value" id="fontSizeValue">52 px</span>
          </label>
          <label class="field full">
            <span class="field-label">水印</span>
            <input
              type="text"
              id="watermarkInput"
              placeholder="可选：输入水印，将以半透明形式铺在页面中央"
            />
          </label>
          <div class="field full">
            <label class="cover-toggle" for="coverToggle">
              <input type="checkbox" id="coverToggle" /> 启用封面页
            </label>
          </div>
          <label class="field full is-hidden" id="coverTitleField">
            <span class="field-label">封面标题</span>
            <input type="text" id="coverTitle" placeholder="输入封面标题" />
          </label>
          <label class="field full is-hidden" id="coverSubtitleField">
            <span class="field-label">封面副标题</span>
            <input type="text" id="coverSubtitle" placeholder="输入封面副标题" />
          </label>
          <label class="field full is-hidden" id="coverTemplateField">
            <span class="field-label">封面版式</span>
            <select id="coverTemplate">
              <option value="centered">大标题居中</option>
              <option value="stripe">左侧色条</option>
              <option value="split">上下分割</option>
            </select>
          </label>
          <div class="field full is-hidden" id="coverLogoField">
            <span class="field-label">封面角标</span>
            <div class="logo-controls">
              <select id="coverLogoPreset">
                <option value="none">无角标</option>
                <option value="sunrise">晨光徽章</option>
                <option value="inkstone">墨韵徽章</option>
                <option value="forest">青叶徽章</option>
                <option value="custom">自定义上传</option>
              </select>
              <div class="logo-actions">
                <input type="file" id="coverLogoUpload" accept="image/*" />
                <button
                  type="button"
                  id="clearLogoBtn"
                  class="button-secondary button-compact"
                >
                  清除角标
                </button>
              </div>
              <div class="logo-preview" id="coverLogoPreview">暂无角标</div>
            </div>
          </div>
        </div>
        <div class="controls">
          <p class="dimension">画布尺寸：1080 × 1440，3:4 比例</p>
          <div class="button-row">
            <button id="fillSampleBtn" type="button" class="button-secondary">
              填充示例文案
            </button>
            <button id="downloadBtn" type="button">导出全部 PNG</button>
            <button id="downloadZipBtn" type="button">一键下载 ZIP</button>
          </div>
          <p id="errorMessage" class="error-message is-hidden" role="alert"></p>
        </div>
        <div class="self-tests" id="selfTestResults" aria-live="polite"></div>
      </section>
      <section class="panel preview-wrapper">
        <h1>排版预览</h1>
        <div id="previewContainer" class="preview-container"></div>
        <p class="hint" id="pageHint">
          预览以 3:4 比例展示。导出的 PNG 将保持 1080 × 1440 像素，并带有适配中文的
          字体与边距。
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

      const DEFAULT_TEXT = `朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。`;

      function showError(message) {
        if (!message) {
          clearError();
          return;
        }
        errorMessage.textContent = message;
        errorMessage.classList.remove('is-hidden');
      }

      function clearError() {

      function normalizeText(raw) {
        if (!raw || !raw.trim()) {
          return DEFAULT_TEXT;
        }
        return raw.replace(/\r\n?/g, '\n').trimEnd();
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const bigint = parseInt(clean.length === 3 ? clean.repeat(2) : clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255
        };
      }

      function mixWithWhite(hex, amount = 0.2) {
        const { r, g, b } = hexToRgb(hex);
        const mix = (channel) => Math.round(channel + (255 - channel) * amount);
        return `#${[mix(r), mix(g), mix(b)]
          .map((value) => value.toString(16).padStart(2, '0'))
          .join('')}`;
      }

      function hexToRgba(hex, alpha) {
        const { r, g, b } = hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function strokeContentFrame(ctx, config, strokeStyle, lineWidth = 2) {
        ctx.save();
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.strokeRect(
          config.margin.left,
          config.margin.top,
          config.width - config.margin.left - config.margin.right,
          config.height - config.margin.top - config.margin.bottom
        );
        ctx.restore();
      }

      function setAccentColor(color) {
        const root = document.documentElement;
        root.style.setProperty('--accent', color);
        root.style.setProperty('--accent-strong', mixWithWhite(color, 0.1));
        root.style.setProperty('--accent-soft', hexToRgba(color, 0.18));
      }

      function getTheme() {
        return THEMES.find((theme) => theme.id === state.theme) || THEMES[0];
      }

      function buildConfig() {
        const theme = getTheme();
        const fontSize = Number(state.fontSize) || 52;
        const lineHeight = Math.round(
          fontSize * (theme.lineHeightMultiplier || 1.4)
        );
        const paragraphSpacing = Math.round(
          lineHeight * (theme.paragraphSpacingMultiplier || 0.7)
        );

        return {
          width: 1080,
          height: 1440,
          margin: theme.margin,
          background: theme.background,
          textColor: theme.textColor,
          pageNumberColor: theme.pageNumberColor,
          fontFamily: theme.fontFamily,
          fontSize,
          lineHeight,
          paragraphSpacing,
          accent: state.primaryColor,
          cover: theme.cover
        };
      }

      function applyTextSettings(ctx, config) {
        ctx.fillStyle = config.textColor;
        ctx.font = `${config.fontSize}px ${config.fontFamily}`;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
      }

      function wrapParagraph(paragraph, maxWidth, config) {
        applyTextSettings(measureCtx, config);
        const lines = [];
        let currentLine = '';

        for (const char of paragraph) {
          const tentativeLine = currentLine + char;
          const { width } = measureCtx.measureText(tentativeLine);
          if (width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = char.trim() ? char : '';
          } else {
            currentLine = tentativeLine;
          }
        }

        if (currentLine) {
          lines.push(currentLine);
        }

        return lines;
      }

      function layoutPages(text, config) {
        const normalized = normalizeText(text);
        const rawParagraphs = normalized.split('\n');
        const maxWidth = config.width - config.margin.left - config.margin.right;
        const usableHeight = config.height - config.margin.top - config.margin.bottom;

        const headingPattern = /^(\s*(#+|[【〔〖]|[0-9０-９]+[\.\)．、]|[一二三四五六七八九十]+[、．.]))/;

        const paragraphInfos = rawParagraphs.map((paragraph, index) => {
          const trimmed = paragraph.trim();
          if (!trimmed) {
            return {
              raw: paragraph,
              lines: [],
              isBlank: true,
              isShort: false,
              keepWithNext: false,
            };
          }

          const lines = wrapParagraph(paragraph, maxWidth, config);
          const isShort = lines.length > 0 && lines.length < 2;
          const keepWithNext = headingPattern.test(trimmed) && index < rawParagraphs.length - 1;

          return {
            raw: paragraph,
            lines,
            isBlank: false,
            isShort,
            keepWithNext,
          };
        });

        const pages = [];
        let currentPage = [];
        let cursorY = 0;

        const commitPage = () => {
          if (currentPage.length) {
            pages.push(currentPage);
          }
          currentPage = [];
          cursorY = 0;
        };

        const pushLine = (text) => {
          currentPage.push({ text, offsetY: cursorY });
          cursorY += config.lineHeight;
        };

        for (let index = 0; index < paragraphInfos.length; index += 1) {
          const paragraph = paragraphInfos[index];
          const isLastParagraph = index === paragraphInfos.length - 1;

          let blankHeightToNextContent = 0;
          let nextContentParagraph = null;
          for (
            let lookahead = index + 1;
            lookahead < paragraphInfos.length;
            lookahead += 1
          ) {
            const candidate = paragraphInfos[lookahead];
            if (candidate.isBlank) {
              blankHeightToNextContent += config.lineHeight;
              continue;
            }
            nextContentParagraph = candidate;
            break;
          }

          if (paragraph.isBlank) {
            if (cursorY + config.lineHeight > usableHeight && currentPage.length) {
              commitPage();
            }
            pushLine('');
            continue;
          }

          while (true) {
            const paragraphHeight = paragraph.lines.length * config.lineHeight;
            const spacingAfter = !isLastParagraph ? config.paragraphSpacing : 0;
            const fitsOnFreshPage = paragraphHeight + spacingAfter <= usableHeight;

            if (cursorY > 0 && fitsOnFreshPage) {
              let requiredExtraSpace = spacingAfter;

              if (nextContentParagraph && nextContentParagraph.isShort) {
                const nextHeight = nextContentParagraph.lines.length * config.lineHeight;
                requiredExtraSpace = Math.max(
                  requiredExtraSpace,
                  config.paragraphSpacing + blankHeightToNextContent + nextHeight
                );
              }

              if (
                paragraph.keepWithNext &&
                nextContentParagraph
              ) {
                const nextMinLines = Math.max(
                  1,
                  Math.min(nextContentParagraph.lines.length, 2)
                );
                const nextMinHeight = nextMinLines * config.lineHeight;
                requiredExtraSpace = Math.max(
                  requiredExtraSpace,
                  config.paragraphSpacing + blankHeightToNextContent + nextMinHeight
                );
              }

              if (cursorY + paragraphHeight + requiredExtraSpace > usableHeight) {
                commitPage();
                continue;
              }
            }

            break;
          }

          let lineIndex = 0;
          let linesOnCurrentPage = 0;

          while (lineIndex < paragraph.lines.length) {
            if (cursorY + config.lineHeight > usableHeight) {
              if (linesOnCurrentPage === 1) {
                const removed = currentPage.pop();
                if (removed) {
                  cursorY -= config.lineHeight;
                  lineIndex -= 1;
                }
              }
              commitPage();
              linesOnCurrentPage = 0;
              continue;
            }

            pushLine(paragraph.lines[lineIndex]);
            lineIndex += 1;
            linesOnCurrentPage += 1;
          }

          if (!isLastParagraph) {
            if (cursorY + config.paragraphSpacing > usableHeight && currentPage.length) {
              commitPage();
            }
            cursorY += config.paragraphSpacing;
          }
        }

        if (currentPage.length) {
          pages.push(currentPage);
        }

        if (!pages.length) {
          pages.push([]);
        }

        return pages;
      }

      function deriveCoverMetadata() {
        const normalized = normalizeText(textInput.value || '');
        const lines = normalized
          .split('\n')
          .map((line) => line.trim())
          .filter((line) => line.length);

        return {
          title: lines[0] || DEFAULT_COVER_TITLE,
          subtitle: lines[1] || DEFAULT_COVER_SUBTITLE
        };
      }

      function syncCoverTextFromSource({ force = false } = {}) {
        const { title, subtitle } = deriveCoverMetadata();

        if (force) {
          state.coverTitleManual = false;
          state.coverSubtitleManual = false;
        }

        if (force || !state.coverTitleManual) {
          state.coverTitle = title;
          if (coverTitleInput) {
            coverTitleInput.value = title;
          }
        }

        if (force || !state.coverSubtitleManual) {
          state.coverSubtitle = subtitle;
          if (coverSubtitleInput) {
            coverSubtitleInput.value = subtitle;
          }
        }
      }

      function updateLogoPreview() {
        if (!coverLogoPreview) {
          return;
        }
        if (state.coverLogo) {
          coverLogoPreview.style.backgroundImage = `url("${state.coverLogo}")`;
          coverLogoPreview.textContent = '';
          coverLogoPreview.classList.add('has-logo');
        } else {
          coverLogoPreview.style.backgroundImage = 'none';
          coverLogoPreview.textContent = '暂无角标';
          coverLogoPreview.classList.remove('has-logo');
        }
      }

      function setCoverLogo(dataUrl, presetId = 'none') {
        if (!dataUrl) {
          state.coverLogo = '';
          state.coverLogoImage = null;
          state.coverLogoPreset = presetId;
          if (coverLogoPresetSelect) {
            coverLogoPresetSelect.value = state.coverLogoPreset;
          }
          updateLogoPreview();
          render();
          return;
        }

        state.coverLogo = dataUrl;
        state.coverLogoImage = null;
        state.coverLogoPreset = presetId;
        updateLogoPreview();
        if (coverLogoPresetSelect) {
          coverLogoPresetSelect.value = state.coverLogoPreset;
        }

        const image = new Image();
        image.crossOrigin = 'anonymous';
        image.onload = () => {
          state.coverLogoImage = image;
          clearError();
          render();
        };
        image.onerror = () => {
          state.coverLogo = '';
          state.coverLogoImage = null;
          state.coverLogoPreset = 'none';
          updateLogoPreview();
          if (coverLogoPresetSelect) {
            coverLogoPresetSelect.value = state.coverLogoPreset;
          }
          showError('角标图片加载失败，请尝试其他文件。');
          render();
        };
        image.src = dataUrl;
      }

      function handleTextChange() {
        syncCoverTextFromSource();
        render();
      }

      function drawBackground(ctx, config, overrideBackground) {
        const background = overrideBackground || config.background;
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, config.width, config.height);
        strokeContentFrame(ctx, config, hexToRgba(config.accent, 0.22));
      }

      function drawWatermark(ctx, config) {
        if (!state.watermark.trim()) {
          return;
        }

        ctx.save();
        ctx.translate(config.width / 2, config.height / 2);
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = hexToRgba(config.accent, 0.08);
        ctx.font = `600 ${Math.round(config.fontSize * 1.8)}px ${config.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.watermark, 0, 0);
        ctx.restore();
      }

      function drawRoundedRectPath(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - r,
          y + height
        );
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawLogoBadge(ctx, config, logoImage, x, y, size = 160, radius = 36) {
        if (!logoImage || !logoImage.complete) {
          return;
        }

        const safeRadius = Math.min(radius, size / 2);

        ctx.save();
        drawRoundedRectPath(ctx, x, y, size, size, safeRadius);
        ctx.clip();
        ctx.drawImage(logoImage, x, y, size, size);
        ctx.restore();

        ctx.save();
        ctx.lineWidth = 6;
        ctx.strokeStyle = hexToRgba(config.accent, 0.45);
        drawRoundedRectPath(ctx, x, y, size, size, safeRadius);
        ctx.stroke();
        ctx.restore();
      }

      function drawPageNumber(ctx, config, pageIndex, totalPages) {
        ctx.save();
        ctx.fillStyle = config.pageNumberColor || hexToRgba(config.textColor, 0.65);
        ctx.font = `400 ${Math.round(config.fontSize * 0.5)}px ${config.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(
          `第 ${pageIndex + 1} 页 / 共 ${totalPages} 页`,
          config.width / 2,
          config.height - config.margin.bottom / 2
        );
        ctx.restore();
      }

      function drawPage(canvas, lines, config, pageIndex, totalPages) {
        canvas.width = config.width;
        canvas.height = config.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, config.width, config.height);

        drawBackground(ctx, config);
        drawWatermark(ctx, config);
        applyTextSettings(ctx, config);

        lines.forEach(({ text, offsetY }) => {
          if (text) {
            ctx.fillText(
              text,
              config.margin.left,
              config.margin.top + offsetY
            );
          }
        });

        drawPageNumber(ctx, config, pageIndex, totalPages);
      }

      function drawCenteredCoverTemplate({
        ctx,
        config,
        title,
        subtitle,
        coverBackground,
        logo
      }) {
        drawBackground(ctx, config, coverBackground);

        ctx.save();
        ctx.fillStyle = hexToRgba(config.accent, 0.08);
        ctx.fillRect(
          config.margin.left,
          config.margin.top,
          config.width - config.margin.left - config.margin.right,
          config.height - config.margin.top - config.margin.bottom
        );
        ctx.restore();

        drawWatermark(ctx, config);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = config.cover?.titleColor || config.textColor;
        ctx.font = `700 ${Math.round(config.fontSize * 2.2)}px ${config.fontFamily}`;
        ctx.fillText(
          title,
          config.width / 2,
          config.margin.top + config.lineHeight * 0.4
        );

        ctx.strokeStyle = hexToRgba(config.accent, 0.3);
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(
          config.width / 2 - 180,
          config.margin.top + config.lineHeight * 2.2
        );
        ctx.lineTo(
          config.width / 2 + 180,
          config.margin.top + config.lineHeight * 2.2
        );
        ctx.stroke();

        ctx.fillStyle = config.cover?.subtitleColor || hexToRgba(config.textColor, 0.7);
        ctx.font = `400 ${Math.round(config.fontSize * 1.1)}px ${config.fontFamily}`;
        ctx.fillText(
          subtitle,
          config.width / 2,
          config.margin.top + config.lineHeight * 3
        );
        ctx.restore();

        if (logo) {
          const size = 180;
          const x = config.width - config.margin.right - size;
          const y = config.margin.top - size / 2;
          drawLogoBadge(ctx, config, logo, x, y, size, 48);
        }

        strokeContentFrame(ctx, config, hexToRgba(config.accent, 0.22));
      }

      function drawStripeCoverTemplate({
        ctx,
        config,
        title,
        subtitle,
        coverBackground,
        logo
      }) {
        drawBackground(ctx, config, coverBackground);

        const stripeWidth = Math.round(config.width * 0.18);
        ctx.save();
        ctx.fillStyle = hexToRgba(config.accent, 0.95);
        ctx.fillRect(0, 0, stripeWidth, config.height);
        ctx.fillStyle = hexToRgba(config.accent, 0.12);
        ctx.fillRect(stripeWidth, 0, Math.round(stripeWidth * 0.45), config.height);
        ctx.restore();

        drawWatermark(ctx, config);

        ctx.save();
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';
        const textX = stripeWidth + config.margin.left * 0.6;
        const textY = config.margin.top;
        ctx.fillStyle = config.cover?.titleColor || config.textColor;
        ctx.font = `700 ${Math.round(config.fontSize * 2)}px ${config.fontFamily}`;
        ctx.fillText(title, textX, textY);

        ctx.strokeStyle = hexToRgba(config.accent, 0.35);
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(textX, textY + config.lineHeight * 1.6);
        ctx.lineTo(
          config.width - config.margin.right,
          textY + config.lineHeight * 1.6
        );
        ctx.stroke();

        ctx.fillStyle = config.cover?.subtitleColor || hexToRgba(config.textColor, 0.75);
        ctx.font = `400 ${Math.round(config.fontSize * 1.05)}px ${config.fontFamily}`;
        ctx.fillText(subtitle, textX, textY + config.lineHeight * 2.6);
        ctx.restore();

        if (logo) {
          const size = 150;
          const x = Math.max(24, stripeWidth / 2 - size / 2);
          const y = config.margin.top - size / 2;
          drawLogoBadge(ctx, config, logo, x, y, size, 42);
        }

        strokeContentFrame(ctx, config, hexToRgba(config.accent, 0.22));
      }

      function drawSplitCoverTemplate({
        ctx,
        config,
        title,
        subtitle,
        coverBackground,
        logo
      }) {
        ctx.fillStyle = coverBackground;
        ctx.fillRect(0, 0, config.width, config.height);

        const topHeight = Math.round(config.height * 0.42);
        ctx.fillStyle = hexToRgba(config.accent, 0.95);
        ctx.fillRect(0, 0, config.width, topHeight);

        ctx.fillStyle = mixWithWhite(config.accent, 0.75);
        ctx.fillRect(0, topHeight, config.width, config.height - topHeight);

        ctx.fillStyle = hexToRgba('#ffffff', 0.22);
        ctx.fillRect(
          config.margin.left,
          topHeight - 6,
          config.width - config.margin.left - config.margin.right,
          12
        );

        drawWatermark(ctx, config);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffffff';
        ctx.font = `700 ${Math.round(config.fontSize * 2.1)}px ${config.fontFamily}`;
        ctx.fillText(title, config.width / 2, config.margin.top * 0.7);

        ctx.fillStyle = hexToRgba(config.textColor, 0.9);
        ctx.font = `400 ${Math.round(config.fontSize * 1.15)}px ${config.fontFamily}`;
        ctx.fillText(
          subtitle,
          config.width / 2,
          topHeight + config.margin.top * 0.4
        );
        ctx.restore();

        if (logo) {
          const size = 170;
          const x = config.width - config.margin.right - size;
          const y = topHeight - size / 2;
          drawLogoBadge(ctx, config, logo, x, y, size, 50);
        }

        strokeContentFrame(ctx, config, hexToRgba(config.accent, 0.28));
      }

      function drawCoverPage(canvas, config, pageIndex, totalPages) {
        canvas.width = config.width;
        canvas.height = config.height;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, config.width, config.height);

        const coverBackground = config.cover?.background || config.background;
        const template =
          COVER_TEMPLATES.find((item) => item.id === state.coverTemplate) ||
          COVER_TEMPLATES[0];
        const logoImage =
          state.coverLogoImage && state.coverLogoImage.complete
            ? state.coverLogoImage
            : null;

        template.draw({
          ctx,
          config,
          title: state.coverTitle,
          subtitle: state.coverSubtitle,
          coverBackground,
          logo: logoImage
        });

        drawPageNumber(ctx, config, pageIndex, totalPages);
      }

      function render() {
        clearError();
        const config = buildConfig();
        measureCanvas.width = config.width;
        measureCanvas.height = config.height;

        const pages = layoutPages(textInput.value, config);
        const includeCover = state.coverEnabled;
        const totalPages = pages.length + (includeCover ? 1 : 0);

        previewContainer.innerHTML = '';

        const allPages = [];
        if (includeCover) {
          allPages.push({ type: 'cover' });
        }
        pages.forEach((lines) => {
          allPages.push({ type: 'content', lines });
        });

        allPages.forEach((page, index) => {
          const card = document.createElement('div');
          card.className = 'preview-card';

          const canvas = document.createElement('canvas');
          if (page.type === 'cover') {
            drawCoverPage(canvas, config, index, totalPages);
          } else {
            drawPage(canvas, page.lines, config, index, totalPages);
          }

          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = `第 ${index + 1} 页`;

          card.appendChild(canvas);
          card.appendChild(label);
          previewContainer.appendChild(card);
        });

        if (!allPages.length) {
          const card = document.createElement('div');
          card.className = 'preview-card';
          const canvas = document.createElement('canvas');
          drawPage(canvas, [], config, 0, 1);
          const label = document.createElement('span');
          label.className = 'page-label';
          label.textContent = '第 1 页';
          card.appendChild(canvas);
          card.appendChild(label);
          previewContainer.appendChild(card);
        }

        const theme = getTheme();
        pageHint.textContent = `当前主题：${theme.name} · 正文字号 ${config.fontSize}px · 总页数 ${totalPages} 页。`;
        runSelfTests(config);
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => {
              if (!blob) {
                reject(new Error('无法从画布生成图像。'));
                return;
              }
              resolve(blob);
            },
            'image/png'
          );
        });
      }

      function getCanvases() {
        return Array.from(previewContainer.querySelectorAll('canvas'));
      }

      async function downloadAllPNGs() {
        clearError();
        const canvases = getCanvases();
        if (!canvases.length) {
          showError('暂无可导出的页面，请先输入或生成内容。');
          return;
        }

        try {
          await Promise.all(
            canvases.map(async (canvas, index) => {
              const blob = await canvasToBlob(canvas);
              const url = URL.createObjectURL(blob);
              const anchor = document.createElement('a');
              anchor.href = url;
              anchor.download = `排版导出-第${String(index + 1).padStart(2, '0')}页.png`;
              document.body.appendChild(anchor);
              anchor.click();
              document.body.removeChild(anchor);
              URL.revokeObjectURL(url);
            })
          );
        } catch (error) {
          console.error(error);
          showError('导出 PNG 失败，请重试。');
        }
      }

      async function downloadZip() {
        clearError();
        if (typeof JSZip === 'undefined') {
          showError('ZIP 支持脚本未正确加载，请检查网络后重试。');
          return;
        }

        const canvases = getCanvases();
        if (!canvases.length) {
          showError('暂无可导出的页面，请先输入或生成内容。');
          return;
        }

        try {
          const zip = new JSZip();
          await Promise.all(
            canvases.map(async (canvas, index) => {
              const blob = await canvasToBlob(canvas);
              zip.file(`排版导出-第${String(index + 1).padStart(2, '0')}页.png`, blob);
            })
          );

          const content = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(content);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = '排版导出-全部页面.zip';
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error(error);
          showError('打包 ZIP 失败，请稍后重试。');
        }
      }

      function runSelfTests(config) {
        const tests = [
          {
            name: '空输入会使用默认示例',
            run: () => normalizeText('   ') === DEFAULT_TEXT
          },
          {
            name: '多段落文本可自动分页',
            run: () => layoutPages(SAMPLE_TEXT, config).length > 1
          },
          {
            name: '保留空白行',
            run: () =>
              layoutPages('首段\n\n次段', config).some((page) =>
                page.some((item) => item.text === '')
              )
          }
        ];

        const results = tests.map((test) => {
          try {
            return { name: test.name, passed: Boolean(test.run()) };
          } catch (error) {
            console.error(`自测失败：${test.name}`, error);
            return { name: test.name, passed: false };
          }
        });

        const passedCount = results.filter((item) => item.passed).length;
        const allPassed = passedCount === results.length;
        selfTestResults.classList.toggle('fail', !allPassed);
        const summary = allPassed
          ? `自测结果：全部 ${passedCount} 项通过 ✅`
          : `自测结果：通过 ${passedCount}/${results.length} 项 ⚠️`;
        const detail = results
          .map((item) => `${item.passed ? '✅' : '❌'} ${item.name}`)
          .join('<br />');
        selfTestResults.innerHTML = `<strong>${summary}</strong><br />${detail}`;
      }

      function toggleCoverFields(show) {
        coverTitleField.classList.toggle('is-hidden', !show);
        coverSubtitleField.classList.toggle('is-hidden', !show);
        coverTemplateField.classList.toggle('is-hidden', !show);
        coverLogoField.classList.toggle('is-hidden', !show);
        if (show) {
          if (!coverTitleInput.value.trim()) {
            coverTitleInput.value = state.coverTitle;
          }
          if (!coverSubtitleInput.value.trim()) {
            coverSubtitleInput.value = state.coverSubtitle;
          }
          coverTemplateSelect.value = state.coverTemplate;
          coverLogoPresetSelect.value = state.coverLogoPreset;
          updateLogoPreview();
        }
      }

      textInput.addEventListener('input', handleTextChange);
      themeSelect.addEventListener('change', (event) => {
        state.theme = event.target.value;
        render();
      });
      primaryColorInput.addEventListener('input', (event) => {
        state.primaryColor = event.target.value;
        setAccentColor(state.primaryColor);
        render();
      });
      fontSizeInput.addEventListener('input', (event) => {
        state.fontSize = Number(event.target.value);
        fontSizeValue.textContent = `${state.fontSize} px`;
        render();
      });
      watermarkInput.addEventListener('input', (event) => {
        state.watermark = event.target.value;
        render();
      });
      coverToggle.addEventListener('change', (event) => {
        state.coverEnabled = event.target.checked;
        toggleCoverFields(state.coverEnabled);
        if (state.coverEnabled) {
          syncCoverTextFromSource();
        }
        render();
      });
      coverTitleInput.addEventListener('input', () => {
        const value = coverTitleInput.value.trim();
        if (value) {
          state.coverTitleManual = true;
          state.coverTitle = value;
        } else {
          state.coverTitleManual = false;
          syncCoverTextFromSource();
        }
        render();
      });
      coverSubtitleInput.addEventListener('input', () => {
        const value = coverSubtitleInput.value.trim();
        if (value) {
          state.coverSubtitleManual = true;
          state.coverSubtitle = value;
        } else {
          state.coverSubtitleManual = false;
          syncCoverTextFromSource();
        }
        render();
      });
      coverTemplateSelect.addEventListener('change', (event) => {
        const templateId = event.target.value;
        const exists = COVER_TEMPLATES.some((item) => item.id === templateId);
        state.coverTemplate = exists ? templateId : 'centered';
        render();
      });
      coverLogoPresetSelect.addEventListener('change', (event) => {
        const value = event.target.value;
        if (value === 'none') {
          coverLogoUpload.value = '';
          setCoverLogo('', 'none');
          clearError();
          return;
        }
        if (value === 'custom') {
          coverLogoUpload.click();
          return;
        }
        const preset = PRESET_LOGOS.find((item) => item.id === value);
        if (preset) {
          coverLogoUpload.value = '';
          setCoverLogo(preset.dataUrl, value);
        }
      });
      coverLogoUpload.addEventListener('change', (event) => {
        const [file] = event.target.files || [];
        if (!file) {
          coverLogoPresetSelect.value = state.coverLogoPreset;
          return;
        }
        if (!file.type.startsWith('image/')) {
          showError('请上传图片文件作为角标。');
          event.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') {
            coverLogoPresetSelect.value = 'custom';
            setCoverLogo(reader.result, 'custom');
          }
        };
        reader.onerror = () => {
          showError('读取角标图片失败，请重试。');
        };
        reader.readAsDataURL(file);
      });
      clearLogoBtn.addEventListener('click', () => {
        coverLogoUpload.value = '';
        coverLogoPresetSelect.value = 'none';
        setCoverLogo('', 'none');
        clearError();
      });
      fillSampleBtn.addEventListener('click', () => {
        textInput.value = SAMPLE_TEXT;
        state.coverTitleManual = false;
        state.coverSubtitleManual = false;
        handleTextChange();
      });
      downloadBtn.addEventListener('click', downloadAllPNGs);
      downloadZipBtn.addEventListener('click', downloadZip);

      document.addEventListener('DOMContentLoaded', () => {
        textInput.value = DEFAULT_TEXT;
        fontSizeValue.textContent = `${state.fontSize} px`;
        setAccentColor(state.primaryColor);
        coverTemplateSelect.value = state.coverTemplate;
        coverLogoPresetSelect.value = state.coverLogoPreset;
        updateLogoPreview();
        toggleCoverFields(state.coverEnabled);
        syncCoverTextFromSource({ force: true });
        coverTitleInput.value = state.coverTitle;
        coverSubtitleInput.value = state.coverSubtitle;
        selfTestResults.textContent = '自测进行中…';
        render();
      });
    </script>
  </body>
</html>
