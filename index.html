<!--
  变更日志：
  1) 提炼本地存储、时间格式、关键词处理、模板渲染与导出、敏感检测等公共方法，提升可维护性。
  2) 为核心交互添加语义化 aria-label、焦点可见样式与更高对比度，增强可访问性。
  3) 新增八组示例测试数据支持一键加载，便于快速验证边界场景。
  4) 补充关键函数 JSDoc 注释，并在复制导出时保留轻提示与敏感校验逻辑。
-->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!--
      架构注释图：
      ┌────────────────┐
      │   UI 控制层    │ 负责表单、列表、预览等交互事件绑定
      └──────┬─────────┘
             │
      ┌──────▼─────────┐      ┌──────────────────┐
      │ 状态管理与存储 │◀────▶│ 关键词索引 & 词库 │
      └──────┬─────────┘      └────────┬─────────┘
             │                           │
      ┌──────▼─────────┐      ┌─────────▼────────┐
      │  模板渲染引擎  │──────▶│ 导出/复制 服务   │
      └────────────────┘      └──────────────────┘
    -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>公众号文章日报生成器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #16a34a;
        --warning: #ca8a04;
        --danger: #dc2626;
        --radius: 14px;
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei",
          "Segoe UI", system-ui, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        padding: 24px clamp(16px, 4vw, 40px);
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      ul,
      ol {
        margin: 0;
      }

      button {
        font-family: inherit;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
      }

      header.top-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 16px 20px;
        border-radius: var(--radius);
      }

      .top-bar-left,
      .top-bar-right {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      label.field-label {
        font-size: 0.92rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      input[type="date"],
      select,
      input[type="text"],
      textarea,
      input[type="time"],
      input[type="number"] {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 8px 12px;
        font-size: 0.95rem;
        background: #fff;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      button.primary {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      button.primary:hover {
        background: var(--primary-hover);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
        transform: translateY(-1px);
      }

      button.secondary {
        background: #f8fafc;
        color: var(--text);
        border: 1px solid #94a3b8;
        padding: 10px 18px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      button.secondary:hover {
        background: #e2e8f0;
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.45);
        outline-offset: 2px;
      }

      button.danger {
        background: #fff5f5;
        color: var(--danger);
        border: 1px solid rgba(220, 38, 38, 0.3);
      }

      button.danger:hover {
        background: #fee2e2;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        padding: clamp(16px, 3vw, 24px);
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
      }

      .section-title {
        font-size: 1.15rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      form#entryForm {
        display: grid;
        gap: 14px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
      }

      .field label {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }

      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .form-actions span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        background: #f8fafc;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        position: sticky;
        top: 0;
        background: #f8fafc;
        z-index: 1;
      }

      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 0.92rem;
        vertical-align: top;
      }

      tbody tr:hover {
        background: rgba(226, 232, 240, 0.3);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 0 8px;
        font-size: 0.75rem;
        line-height: 1.8;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        margin-right: 4px;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .tag:hover,
      .tag.active-tag {
        background: rgba(37, 99, 235, 0.15);
        color: var(--primary-hover);
      }

      .importance {
        font-weight: 600;
        color: var(--warning);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .actions button {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .actions button:hover {
        background: #e2e8f0;
      }

      .actions button[data-action="colloquial"].applied {
        background: rgba(37, 99, 235, 0.12);
        border-color: rgba(37, 99, 235, 0.3);
        color: var(--primary-hover);
        cursor: pointer;
      }

      .preview-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .preview-header .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .preview-header .preview-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        flex: 1 1 320px;
      }

      .preview-header .preview-controls {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }

      .preview-header .preview-controls .toggle {
        color: var(--text);
        font-weight: 500;
      }

      .preview-header .preview-controls .toggle.disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .preview-header .preview-controls .toggle.disabled input {
        pointer-events: none;
      }

      .preview-header .preview-controls button.secondary {
        border-radius: 999px;
      }

      .preview-surface {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: clamp(16px, 3vw, 24px);
        background: #fff;
        max-height: 70vh;
        overflow: auto;
        line-height: 1.7;
        font-size: 0.98rem;
      }

      .preview-surface h1 {
        font-size: 1.6rem;
        margin-bottom: 12px;
      }

      .preview-surface h2 {
        font-size: 1.18rem;
        margin-top: 22px;
        margin-bottom: 12px;
      }

      .preview-surface p {
        margin-bottom: 10px;
      }

      .preview-surface ul {
        padding-left: 20px;
        margin-bottom: 14px;
      }

      .preview-entry {
        position: relative;
        padding: 12px 12px 12px 16px;
        border-left: 3px solid transparent;
        border-radius: 8px;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .preview-entry + .preview-entry {
        margin-top: 12px;
      }

      .preview-surface h2 + .preview-entry {
        margin-top: 8px;
      }

      .preview-entry.has-warning {
        border-color: var(--warning);
        background: rgba(202, 138, 4, 0.08);
      }

      .preview-entry-warning {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(202, 138, 4, 0.14);
        color: var(--warning);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.78rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .preview-placeholder {
        color: var(--muted);
        text-align: center;
        padding: 60px 0;
      }

      .status-message {
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.2rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e0e7ff;
        color: var(--primary);
        font-weight: 600;
        font-size: 0.75rem;
      }

      .history-select {
        position: relative;
      }

      .keyword-suggestions {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px;
        z-index: 10;
      }

      .keyword-suggestions button {
        border: none;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
      }

      .keyword-suggestions button:hover {
        background: rgba(37, 99, 235, 0.16);
        transform: translateY(-1px);
      }

      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.35);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 60px 16px 24px;
        z-index: 999;
      }

      .settings-dialog {
        width: min(520px, 100%);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .weekly-dialog {
        width: min(880px, 100%);
        max-height: calc(100vh - 120px);
        overflow: hidden;
      }

      .weekly-body {
        display: flex;
        flex-direction: column;
        gap: 18px;
        height: 100%;
      }

      .weekly-date-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        padding: 4px;
        max-height: 220px;
        overflow-y: auto;
      }

      .empty-tip {
        font-size: 0.9rem;
        color: var(--muted);
        padding: 24px 12px;
        text-align: center;
      }

      .weekly-date-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .weekly-date-item input {
        accent-color: var(--primary);
      }

      .weekly-date-item strong {
        font-size: 0.95rem;
      }

      .weekly-date-item span {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .weekly-date-item.active {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        background: rgba(37, 99, 235, 0.04);
      }

      .weekly-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .weekly-action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .weekly-selected-count {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .weekly-preview {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-height: 0;
      }

      .weekly-preview-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .weekly-preview-surface {
        max-height: 360px;
        overflow: auto;
      }

      .preview-warning {
        background: rgba(202, 138, 4, 0.12);
        border: 1px solid rgba(202, 138, 4, 0.4);
        color: var(--warning);
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.88rem;
      }

      .weekly-toc {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        background: rgba(37, 99, 235, 0.04);
        margin-bottom: 8px;
      }

      .weekly-toc strong {
        display: block;
        margin-bottom: 6px;
        font-size: 0.92rem;
      }

      .weekly-toc ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .weekly-toc a {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .weekly-toc a:hover {
        text-decoration: underline;
      }

      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .settings-section h3 {
        margin-bottom: 8px;
      }

      .settings-tip {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .template-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .template-option {
        display: flex;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .template-option input {
        margin-top: 4px;
      }

      .template-option strong {
        display: block;
        margin-bottom: 6px;
      }

      .template-option p {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .template-option.active {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .preview-surface {
          max-height: none;
        }
      }

      @media (max-width: 640px) {
        header.top-bar {
          flex-direction: column;
          align-items: flex-start;
        }

        .top-bar-right {
          width: 100%;
          justify-content: flex-start;
        }

        .form-actions {
          flex-direction: column;
          align-items: flex-start;
        }

        .preview-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="top-bar-left">
          <label class="field-label" for="datePicker">
            📅 日期
            <input type="date" id="datePicker" />
          </label>
          <label class="field-label history-select" for="historySelect">
            🗂️ 历史记录
            <select id="historySelect">
              <option value="">选择历史日期…</option>
            </select>
          </label>
          <label class="field-label history-select" for="sampleDataSelect">
            🧪 示例数据
            <select id="sampleDataSelect">
              <option value="">加载示例数据…</option>
            </select>
          </label>
          <button
            id="openWeeklyBtn"
            class="secondary"
            aria-label="合并多天内容生成周报"
          >
            🗓️ 合并为周报
          </button>
        </div>
        <div class="top-bar-right">
          <button
            id="settingsBtn"
            class="secondary"
            aria-label="打开设置面板"
            data-open="settings"
          >
            ⚙️ 设置
          </button>
          <button id="saveBtn" class="primary" aria-label="保存当天草稿">
            💾 保存
          </button>
          <button
            id="clearBtn"
            class="secondary danger"
            aria-label="清空当天草稿"
          >
            🧹 清空当天
          </button>
        </div>
      </header>

      <div class="layout">
        <div class="panel" id="leftPanel">
          <div class="section-title">新增学习记录</div>
          <form id="entryForm">
            <div class="field-grid">
              <div class="field">
                <label for="timeInput">时间</label>
                <input type="time" id="timeInput" required />
              </div>
              <div class="field">
                <label for="categoryInput">分类</label>
                <select id="categoryInput" required>
                  <option value="AI">AI</option>
                  <option value="财税">财税</option>
                  <option value="供应链">供应链</option>
                  <option value="运营">运营</option>
                  <option value="阅读">阅读</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="field">
                <label for="importanceInput">重要程度</label>
                <select id="importanceInput" required>
                  <option value="5">5 - 必须记录</option>
                  <option value="4">4 - 很重要</option>
                  <option value="3">3 - 有参考</option>
                  <option value="2">2 - 一般</option>
                  <option value="1">1 - 备忘</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="keywordsInput">关键词（逗号、空格分隔）</label>
              <input
                type="text"
                id="keywordsInput"
                placeholder="如：AIGC，prompt，财税" />
              <div id="keywordSuggestions" class="keyword-suggestions" hidden></div>
            </div>
            <div class="field">
              <label for="contentInput">内容</label>
              <textarea
                id="contentInput"
                placeholder="记录今天学到的知识点、案例或复盘…"
                required
              ></textarea>
            </div>
            <label class="toggle">
              <input type="checkbox" id="publishableInput" checked /> 可对外发布
            </label>
            <div class="form-actions">
              <button
                type="submit"
                class="primary"
                id="submitBtn"
                aria-label="添加学习记录"
              >
                ➕ 添加记录
              </button>
              <button
                type="button"
                class="secondary"
                id="cancelEditBtn"
                aria-label="取消当前编辑"
                hidden
              >
                取消编辑
              </button>
              <span id="formStatus" aria-live="polite"
                >默认保存到当前日期草稿</span
              >
            </div>
          </form>

          <div class="section-title">当日记录列表</div>
          <div class="filters">
            <label class="field">
              <span>按分类筛选</span>
              <select id="filterCategory">
                <option value="">全部分类</option>
                <option value="AI">AI</option>
                <option value="财税">财税</option>
                <option value="供应链">供应链</option>
                <option value="运营">运营</option>
                <option value="阅读">阅读</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label class="field">

      const StorageService = {
        /**
         * 读取指定日期的草稿。
         * @param {string} date
         * @returns {DailyDoc | null}
         */
        readDoc(date) {
          if (!date) return null;
          const stored = localStorage.getItem(STORAGE_PREFIX + date);
          if (!stored) return null;
          try {
            const parsed = JSON.parse(stored);
            if (parsed && Array.isArray(parsed.entries)) {
              return parsed;
            }
          } catch (error) {
            console.warn("草稿读取失败", error);
          }
          return null;
        },
        /**
         * 写入指定日期的草稿。
         * @param {string} date
         * @param {Entry[]} entries
         */
        writeDoc(date, entries) {
          if (!date) return;
          const payload = { date, entries };
          localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify(payload));
        },
        /**
         * 删除指定日期草稿。
         * @param {string} date
         */
        removeDoc(date) {
          if (!date) return;
          localStorage.removeItem(STORAGE_PREFIX + date);
        },
        /**
         * 读取指定日期的人话化草稿。
         * @param {string} date
         * @returns {Map<string, string>}
         */
        readColloquial(date) {
          if (!date) return new Map();
          const stored = localStorage.getItem(COLLOQUIAL_PREFIX + date);
          if (!stored) return new Map();
          try {
            const parsed = JSON.parse(stored);
            if (parsed && typeof parsed === "object") {
              return new Map(Object.entries(parsed));
            }
          } catch (error) {
            console.warn("人话化草稿读取失败", error);
          }
          return new Map();
        },
        /**
         * 保存指定日期的人话化草稿。
         * @param {string} date
         * @param {Map<string, string>} map
         */
        writeColloquial(date, map) {
          if (!date) return;
          if (!map || !map.size) {
            localStorage.removeItem(COLLOQUIAL_PREFIX + date);
            return;
          }
          const payload = {};
          map.forEach((value, key) => {
            payload[key] = value;
          });
          localStorage.setItem(COLLOQUIAL_PREFIX + date, JSON.stringify(payload));
        },
        /**
         * 清除指定日期的人话化草稿。
         * @param {string} date
         */
        removeColloquial(date) {
          if (!date) return;
          localStorage.removeItem(COLLOQUIAL_PREFIX + date);
        },
        /**
         * 读取缓存的关键词索引。
         * @param {string} date
         * @returns {Record<string, number> | null}
         */
        readKeywordIndex(date) {
          if (!date) return null;
          const stored = localStorage.getItem(KEYWORD_INDEX_PREFIX + date);
          if (!stored) return null;
          try {
            return JSON.parse(stored);
          } catch (error) {
            console.warn("关键词索引解析失败", error);
            return null;
          }
        },
        /**
         * 写入关键词索引。
         * @param {string} date
         * @param {Record<string, number>} index
         */
        writeKeywordIndex(date, index) {
          if (!date) return;
          if (!index || !Object.keys(index).length) {
            localStorage.removeItem(KEYWORD_INDEX_PREFIX + date);
            return;
          }
          localStorage.setItem(
            KEYWORD_INDEX_PREFIX + date,
            JSON.stringify(index)
          );
        },
        /**
         * 删除关键词索引。
         * @param {string} date
         */
        removeKeywordIndex(date) {
          if (!date) return;
          localStorage.removeItem(KEYWORD_INDEX_PREFIX + date);
        },
        /**
         * 获取所有草稿日期列表。
         * @returns {string[]}
         */
        listDocDates() {
          const dates = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key) continue;
            if (key === TEMPLATE_CONFIG_KEY) continue;
            if (key.startsWith(KEYWORD_INDEX_PREFIX)) continue;
            if (key.startsWith(STORAGE_PREFIX)) {
              const date = key.replace(STORAGE_PREFIX, "");
              if (/^\d{4}-\d{2}-\d{2}$/.test(date)) {
                dates.push(date);
              }
            }
          }
          return dates.sort((a, b) => b.localeCompare(a));
        },
        /**
         * 读取模板偏好设置。
         * @returns {{ active: string } | null}
         */
        readTemplateConfig() {
          const stored = localStorage.getItem(TEMPLATE_CONFIG_KEY);
          if (!stored) return null;
          try {
            return JSON.parse(stored);
          } catch (error) {
            console.warn("模板配置读取失败", error);
            return null;
          }
        },

      const DateUtils = {
        /**
         * 将日期格式化为 yyyy-mm-dd。
         * @param {Date} date
         * @returns {string}
         */
        toISODate(date) {
          return date.toISOString().slice(0, 10);
        },
        /**
         * 将日期字符串格式化为 yyyy.mm.dd。
         * @param {string} dateStr
         * @returns {string}
         */
        toTitle(dateStr) {
          return (dateStr || "").replace(/-/g, ".");
        },
        /**
         * 获取当前时间的 HH:mm 字符串。
         * @returns {string}
         */
        currentTimeValue() {
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, "0");
          const minutes = String(now.getMinutes()).padStart(2, "0");
          return `${hours}:${minutes}`;
        },
      };

      const KeywordUtils = {
        /**
         * 将关键词输入解析为数组。
         * @param {string} value
         * @returns {string[]}
         */
        parse(value) {
          if (!value) return [];
          const parts = value
            .split(/[\s,，]+/)
            .map((part) => part.trim().toLowerCase())
            .filter(Boolean);
          return Array.from(new Set(parts));
        },
        /**
         * 根据记录构建关键词索引。
         * @param {Entry[]} entries
         * @returns {Record<string, number>}
         */
        buildIndex(entries) {
          const stats = {};
          entries.forEach((entry) => {
            entry.keywords.forEach((kw) => {
              stats[kw] = (stats[kw] || 0) + 1;
            });
          });
          return stats;
        },
        /**
         * 汇总缓存的关键词索引。
         * @param {Map<string, Record<string, number>>} cache
         * @returns {Map<string, number>}
         */
        mergeCache(cache) {
          const aggregate = new Map();
          cache.forEach((index) => {
            Object.entries(index || {}).forEach(([kw, count]) => {
              aggregate.set(kw, (aggregate.get(kw) || 0) + count);
            });
          });
          return aggregate;
        },
      };

      function handleKeywordInput() {
        if (suggestionHideTimer) clearTimeout(suggestionHideTimer);
        const query = getCurrentKeywordQuery();
        currentSuggestionQuery = query ?? "";
        if (query === null) {
          hideKeywordSuggestions();
          return;
        }
        renderKeywordSuggestions(query);
      }

      function getCurrentKeywordQuery() {
        const cursor = keywordsInput.selectionStart ?? keywordsInput.value.length;
        const textBefore = keywordsInput.value.slice(0, cursor);
        const match = textBefore.match(/#([^\s,，]*)$/);
        if (!match) return null;
        return match[1].toLowerCase();
      }

      function renderKeywordSuggestions(query) {
        if (!state.keywordLibrary || state.keywordLibrary.size === 0) {
          hideKeywordSuggestions();
          return;
        }
        const normalized = (query || "").toLowerCase();
        const candidates = Array.from(state.keywordLibrary.entries())
          .filter(([kw]) => !normalized || kw.includes(normalized))
          .sort((a, b) => {
            if (b[1] === a[1]) return a[0].localeCompare(b[0]);
            return b[1] - a[1];
          })
          .slice(0, 8);
        if (!candidates.length) {
          hideKeywordSuggestions();
          return;
        }
        keywordSuggestions.innerHTML = candidates
          .map(([kw, count]) => {
            const encoded = encodeURIComponent(kw);
            return `<button type="button" data-keyword="${encoded}">#${escapeHtml(kw)} · ${count}</button>`;
          })
          .join("");
        keywordSuggestions.hidden = false;
      }

      function hideKeywordSuggestions() {
        keywordSuggestions.hidden = true;
        keywordSuggestions.innerHTML = "";
      }

      function handleSuggestionClick(event) {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const keyword = target.dataset.keyword;
        if (!keyword) return;
        insertKeywordSuggestion(keyword);
      }

      function insertKeywordSuggestion(keyword) {
        const cursor = keywordsInput.selectionStart ?? keywordsInput.value.length;
        const value = keywordsInput.value;
        const before = value.slice(0, cursor);
        const after = value.slice(cursor);
        const replaced = before.replace(/#([^\s,，]*)$/, keyword);
        let joiner = "";
        if (!after || !/^[\s,，]/.test(after)) {
          joiner = replaced && !/[\s,，]$/.test(replaced) ? ", " : " ";
        }
        const newBefore = replaced + joiner;
        keywordsInput.value = newBefore + after;
        const newCursor = newBefore.length;
        keywordsInput.focus();
        keywordsInput.setSelectionRange(newCursor, newCursor);
        hideKeywordSuggestions();
        currentSuggestionQuery = "";
      }

      function updateKeywordSuggestions() {
        if (!keywordSuggestions.hidden) {
          renderKeywordSuggestions(currentSuggestionQuery);
        }
      }

      function handleDateChange() {
        const date = datePicker.value;
        if (!date || date === state.currentDoc.date) return;
        if (state.isDirty) {
          const confirmed = confirm("当前草稿尚未保存，切换日期会丢失修改，是否继续？");
